####################################################################
# Gatekeeper Constraint: apply the Brewlet managed-dependency check to
# pods on CREATE and UPDATE. The template itself restricts enforcement
# to spec.runtimeClassName: brewlet pods, so this constraint can safely
# match all Pods.
#
# enforcementAction: deny fails closed. Use `warn` or `dryrun` first to
# observe results without blocking, then switch to `deny`.
####################################################################
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: BrewletManagedDependencies
metadata:
  name: brewlet-managed-dependencies
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    # Optionally scope to the namespaces where Brewlet workloads run:
    # namespaces: ["apps", "payments"]
    # Infra namespaces are excluded only to avoid a bootstrap deadlock if the
    # provider is unavailable while the control plane itself is starting. The
    # brewlet namespace is deliberately NOT excluded: no Brewlet component pod
    # (operator, admission, provisioner, cleanup, exporter) sets
    # runtimeClassName: brewlet, so the template already no-ops on them, and
    # excluding it would only create a bypass surface. Restrict who can create
    # pods in the namespaces listed here (see admission/README.md).
    excludedNamespaces:
      - kube-system
      - gatekeeper-system
      - ratify-service
