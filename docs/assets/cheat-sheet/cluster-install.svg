<svg xmlns="http://www.w3.org/2000/svg" width="600" height="490" viewBox="0 0 600 490" role="img" aria-labelledby="title description">
  <title id="title">Install Brewlet on a cluster</title>
  <desc id="description">Apply the release CRDs and install the Helm chart. Approve a digest-pinned runtime with a RuntimeImage, then select controlled nodes and an installation policy with a NodeProfile. Check control-plane and node readiness, and run a test application.</desc>
  <style>
    text { font-family: "Segoe UI", Aptos, Calibri, sans-serif; fill: #2a1f18; }
    .heading { font-size: 25px; font-weight: 700; }
    .subheading { font-size: 17px; fill: #6b5d51; }
    .step { font-size: 20px; font-weight: 700; fill: #2857b0; }
    .card-title { font-size: 20px; font-weight: 700; }
    .body { font-size: 17px; fill: #51463d; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#6f4e37"/></marker>
  </defs>
  <rect x="1" y="1" width="598" height="488" rx="18" fill="#fffdf9" stroke="#e7dcc9" stroke-width="2"/>
  <text class="heading" x="24" y="40">Install Brewlet on a cluster</text>
  <text class="subheading" x="24" y="66">Control plane first; selected node pools next.</text>

  <rect x="24" y="88" width="552" height="76" rx="10" fill="#fff" stroke="#e7dcc9" stroke-width="2"/>
  <circle cx="57" cy="126" r="20" fill="#eaf1ff"/>
  <text class="step" x="57" y="133" text-anchor="middle">1</text>
  <text class="card-title" x="94" y="119">CRDs + chart</text>
  <text class="body" x="94" y="145">Apply release CRDs; install with Helm</text>
  <path d="M300 164V185" fill="none" stroke="#6f4e37" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="24" y="190" width="552" height="76" rx="10" fill="#fff" stroke="#e7dcc9" stroke-width="2"/>
  <circle cx="57" cy="228" r="20" fill="#eaf1ff"/>
  <text class="step" x="57" y="235" text-anchor="middle">2</text>
  <text class="card-title" x="94" y="221">RuntimeImage</text>
  <text class="body" x="94" y="247">Approve a digest and non-root identity</text>
  <path d="M300 266V287" fill="none" stroke="#6f4e37" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="24" y="292" width="552" height="76" rx="10" fill="#fff" stroke="#e7dcc9" stroke-width="2"/>
  <circle cx="57" cy="330" r="20" fill="#eaf1ff"/>
  <text class="step" x="57" y="337" text-anchor="middle">3</text>
  <text class="card-title" x="94" y="323">NodeProfile</text>
  <text class="body" x="94" y="349">Select a pool and installation policy</text>
  <path d="M300 368V389" fill="none" stroke="#6f4e37" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="24" y="394" width="552" height="76" rx="10" fill="#fbf4e6" stroke="#e7dcc9" stroke-width="2"/>
  <circle cx="57" cy="432" r="20" fill="#f3e7d8"/>
  <text class="step" x="57" y="439" text-anchor="middle">4</text>
  <text class="card-title" x="94" y="425">Verify and use</text>
  <text class="body" x="94" y="451">Check readiness, then run an application</text>
</svg>
