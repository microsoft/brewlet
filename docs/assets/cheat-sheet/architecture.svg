<svg xmlns="http://www.w3.org/2000/svg" width="600" height="438" viewBox="0 0 600 438" role="img" aria-labelledby="title description">
  <title id="title">Application and runtime meet on the node</title>
  <desc id="description">Developers publish an application artifact containing code, dependencies and launch metadata to an OCI registry. Platform administrators approve a RuntimeImage and offer it through a NodeProfile. Kubelet pulls the application image and the provisioner installs the approved runtime root. A workload chooses the image and runtime ID; the Brewlet shim combines the read-only app and runtime root to start an isolated process.</desc>
  <style>
    text { font-family: "Segoe UI", Aptos, Calibri, sans-serif; fill: #2a1f18; }
    .heading { font-size: 25px; font-weight: 700; }
    .subheading { font-size: 17px; fill: #6b5d51; }
    .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 1px; }
    .card-title { font-size: 20px; font-weight: 700; }
    .body { font-size: 17px; fill: #51463d; }
    .flow-label { font-size: 15px; font-weight: 600; fill: #51463d; }
    .chip { font-size: 17px; font-weight: 600; }
    .blue { fill: #2857b0; }
    .brown { fill: #6f4e37; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#326ce5"/></marker>
    <marker id="arrow-brown" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#6f4e37"/></marker>
  </defs>
  <rect x="1" y="1" width="598" height="436" rx="18" fill="#fffdf9" stroke="#e7dcc9" stroke-width="2"/>
  <text class="heading" x="24" y="40">Two inputs. One container.</text>
  <text class="subheading" x="24" y="66">Application and runtime are delivered separately.</text>

  <rect x="24" y="88" width="258" height="126" rx="12" fill="#fff" stroke="#326ce5" stroke-width="2"/>
  <text class="eyebrow blue" x="42" y="113">DEVELOPER</text>
  <text class="card-title" x="42" y="141">Application artifact</text>
  <text class="body" x="42" y="167">App + dependencies</text>
  <text class="body" x="42" y="192">launch.json + OCI registry</text>

  <rect x="318" y="88" width="258" height="126" rx="12" fill="#fff" stroke="#6f4e37" stroke-width="2"/>
  <text class="eyebrow brown" x="336" y="113">PLATFORM</text>
  <text class="card-title" x="336" y="141">Approved runtime</text>
  <text class="body" x="336" y="167">RuntimeImage source</text>
  <text class="body" x="336" y="192">NodeProfile pool policy</text>

  <path d="M153 214V261" fill="none" stroke="#326ce5" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text class="flow-label" x="165" y="242">kubelet pulls</text>
  <path d="M447 214V261" fill="none" stroke="#6f4e37" stroke-width="2" marker-end="url(#arrow-brown)"/>
  <text class="flow-label" x="459" y="242">provisioner installs</text>

  <rect x="24" y="267" width="552" height="148" rx="12" fill="#fbf4e6" stroke="#e7dcc9" stroke-width="2"/>
  <text class="eyebrow brown" x="42" y="292">BREWLET NODE</text>
  <text class="card-title" x="42" y="319">Workload selects image + runtime ID</text>
  <rect x="42" y="334" width="222" height="38" rx="8" fill="#eaf1ff"/>
  <text class="chip blue" x="153" y="359" text-anchor="middle">Read-only /app</text>
  <text class="card-title" x="300" y="360" text-anchor="middle">+</text>
  <rect x="336" y="334" width="222" height="38" rx="8" fill="#f3e7d8"/>
  <text class="chip brown" x="447" y="359" text-anchor="middle">Runtime root</text>
  <text class="body" x="42" y="398">Shim starts an isolated application process.</text>
</svg>
