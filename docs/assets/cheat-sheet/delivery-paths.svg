<svg xmlns="http://www.w3.org/2000/svg" width="600" height="570" viewBox="0 0 600 570" role="img" aria-labelledby="title description">
  <title id="title">Three application delivery paths</title>
  <desc id="description">For local testing, build an application artifact and run it with an explicitly chosen runtime. For direct Kubernetes delivery, build the app with its dependencies, push it, and deploy a workload. For governed composition, publish an app-only artifact and a dependency layer set, bundle their pinned digests, verify and test the resulting digest, and deploy it.</desc>
  <style>
    text { font-family: "Segoe UI", Aptos, Calibri, sans-serif; fill: #2a1f18; }
    .heading { font-size: 25px; font-weight: 700; }
    .subheading { font-size: 17px; fill: #6b5d51; }
    .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 1px; fill: #6f4e37; }
    .command { font-family: Consolas, "Courier New", monospace; font-size: 18px; font-weight: 700; fill: #2857b0; }
    .label { font-size: 18px; font-weight: 600; }
    .note { font-size: 16px; fill: #51463d; }
    .arrow { fill: none; stroke: #6f4e37; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#6f4e37"/></marker>
  </defs>
  <rect x="1" y="1" width="598" height="568" rx="18" fill="#fffdf9" stroke="#e7dcc9" stroke-width="2"/>
  <text class="heading" x="24" y="40">Choose an application path</text>
  <text class="subheading" x="24" y="66">The runtime remains a separate platform choice.</text>

  <rect x="24" y="88" width="552" height="104" rx="12" fill="#fff" stroke="#e7dcc9" stroke-width="2"/>
  <text class="eyebrow" x="42" y="113">LOCAL TESTING</text>
  <rect x="42" y="130" width="146" height="42" rx="8" fill="#eaf1ff"/>
  <text class="command" x="115" y="157" text-anchor="middle">build</text>
  <path class="arrow" d="M191 151H224"/>
  <rect x="228" y="130" width="306" height="42" rx="8" fill="#eaf1ff"/>
  <text class="command" x="381" y="157" text-anchor="middle">run --runtime</text>

  <rect x="24" y="206" width="552" height="104" rx="12" fill="#fff" stroke="#e7dcc9" stroke-width="2"/>
  <text class="eyebrow" x="42" y="231">DIRECT KUBERNETES DELIVERY</text>
  <rect x="42" y="248" width="132" height="42" rx="8" fill="#eaf1ff"/>
  <text class="command" x="108" y="275" text-anchor="middle">build</text>
  <path class="arrow" d="M178 269H210"/>
  <rect x="214" y="248" width="132" height="42" rx="8" fill="#eaf1ff"/>
  <text class="command" x="280" y="275" text-anchor="middle">push</text>
  <path class="arrow" d="M350 269H382"/>
  <rect x="386" y="248" width="148" height="42" rx="8" fill="#f3e7d8"/>
  <text class="label" x="460" y="275" text-anchor="middle">Deploy</text>

  <rect x="24" y="324" width="552" height="222" rx="12" fill="#fff" stroke="#e7dcc9" stroke-width="2"/>
  <text class="eyebrow" x="42" y="349">GOVERNED COMPOSITION</text>
  <rect x="42" y="365" width="230" height="60" rx="8" fill="#eaf1ff"/>
  <text class="command" x="157" y="389" text-anchor="middle">build + push</text>
  <text class="note" x="157" y="413" text-anchor="middle">app-only digest</text>
  <rect x="328" y="365" width="230" height="60" rx="8" fill="#eaf1ff"/>
  <text class="command" x="443" y="389" text-anchor="middle">layer-set</text>
  <text class="note" x="443" y="413" text-anchor="middle">dependency set digest</text>
  <path d="M443 425V440H157" fill="none" stroke="#6f4e37" stroke-width="2"/>
  <path class="arrow" d="M157 425V440H108V451"/>
  <rect x="42" y="455" width="132" height="42" rx="8" fill="#eaf1ff"/>
  <text class="command" x="108" y="482" text-anchor="middle">bundle</text>
  <path class="arrow" d="M178 476H210"/>
  <rect x="214" y="455" width="172" height="42" rx="8" fill="#eaf1ff"/>
  <text class="label" x="300" y="482" text-anchor="middle">Verify + test</text>
  <path class="arrow" d="M390 476H422"/>
  <rect x="426" y="455" width="132" height="42" rx="8" fill="#f3e7d8"/>
  <text class="label" x="492" y="482" text-anchor="middle">Deploy</text>
  <text class="note" x="42" y="527">Test and deploy the exact candidate digest.</text>
</svg>
