<svg xmlns="http://www.w3.org/2000/svg" width="600" height="335" viewBox="0 0 600 335" role="img" aria-labelledby="title description">
  <title id="title">Runtime rotation preserves running tasks</title>
  <desc id="description">A compatible RuntimeImage ID changes its approved source from digest A to digest B. Already running tasks keep their leased generation A until replaced. New tasks use generation B after it is installed and authorized. The application artifact and its dependencies under /app do not change.</desc>
  <style>
    text { font-family: "Segoe UI", Aptos, Calibri, sans-serif; fill: #2a1f18; }
    .heading { font-size: 25px; font-weight: 700; }
    .subheading { font-size: 17px; fill: #6b5d51; }
    .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 1px; }
    .card-title { font-size: 20px; font-weight: 700; }
    .body { font-size: 17px; fill: #51463d; }
    .blue { fill: #2857b0; }
    .brown { fill: #6f4e37; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#6f4e37"/></marker>
  </defs>
  <rect x="1" y="1" width="598" height="333" rx="18" fill="#fffdf9" stroke="#e7dcc9" stroke-width="2"/>
  <text class="heading" x="24" y="40">Rotation is not a hot patch</text>
  <text class="subheading" x="24" y="66">The same compatible runtime ID gets a new source.</text>

  <rect x="24" y="88" width="552" height="56" rx="10" fill="#f3e7d8"/>
  <text class="body" x="42" y="123">Approved source:</text>
  <text class="card-title" x="228" y="123">digest A</text>
  <path d="M321 116H373" fill="none" stroke="#6f4e37" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="card-title" x="395" y="123">digest B</text>

  <rect x="24" y="162" width="258" height="108" rx="10" fill="#fff" stroke="#326ce5" stroke-width="2"/>
  <text class="eyebrow blue" x="42" y="188">ALREADY RUNNING</text>
  <text class="card-title" x="42" y="215">Keep generation A</text>
  <text class="body" x="42" y="242">until replaced</text>

  <rect x="318" y="162" width="258" height="108" rx="10" fill="#fff" stroke="#6f4e37" stroke-width="2"/>
  <text class="eyebrow brown" x="336" y="188">NEW TASKS</text>
  <text class="card-title" x="336" y="215">Use generation B</text>
  <text class="body" x="336" y="242">after B is installed</text>

  <text class="body" x="24" y="306">Same app artifact; /app dependencies stay unchanged.</text>
</svg>
