site_name: Brewlet 2.0
site_description: Language-neutral application artifacts and platform-managed runtimes on Kubernetes.
docs_dir: ../docs
site_dir: _site/docs
repo_url: https://github.com/microsoft/brewlet/tree/brewlet-2.0
repo_name: microsoft/brewlet
edit_uri: https://github.com/microsoft/brewlet/edit/brewlet-2.0/docs/
exclude_docs: |
  /README.md
  /compatibility.md
  /live-validation.md
theme:
  name: material
  custom_dir: overrides
  font: false
  favicon: ../assets/images/favicon.svg
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
plugins:
  - search:
      lang: en
hooks:
  - scripts/docs_hooks.py
extra_css:
  - ../assets/css/theme.css
  - stylesheets/brewlet-docs.css
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
nav:
  - Understand:
      - Overview: index.md
      - Concepts and architecture: concepts.md
      - When to use Brewlet: choosing-brewlet.md
      - Compatibility policy: compatibility-policy.md
  - Try:
      - Build and package: getting-started.md
      - First local deployment: local-kubernetes.md
      - Guided demonstration: demo.md
  - Workshops:
      - Choose your path: workshops/index.md
      - Platform workshop: workshops/platform.md
      - Developer workshop: workshops/developer.md
  - Ship applications:
      - Package and deploy: applications.md
      - Workload guides:
          - Overview and launch previews: language-recipes.md
          - Java: java.md
          - Python: python.md
          - Node.js: nodejs.md
          - .NET: dotnet.md
          - WebAssembly: webassembly.md
      - Dependency layer sets: dependency-layer-sets.md
      - Governed composition and external scanning: managed-composition.md
      - Resources and lifecycle: resources.md
      - Instrumentation: instrumentation.md
  - Enable infrastructure:
      - Source-built installation: installation.md
      - Configuration: configuration.md
      - Runtime images and pools: runtime-images.md
      - Providers and fencing: providers.md
      - Multi-architecture fleets: multi-arch.md
  - Operate:
      - Rotation and cleanup: operations.md
      - Security and hardening: security.md
      - Registry and certificate trust: registry-trust.md
      - Observability and metrics: observability.md
      - Troubleshooting: troubleshooting.md
      - Safe removal and recovery: uninstallation.md
      - Verification and limitations: verification.md
  - Reference:
      - Contracts and glossary: reference.md
      - CLI reference: cli-reference.md
      - Main vs. Brewlet 2.0: brewlet-2-comparison.md
      - Proposal 0009: https://github.com/microsoft/brewlet/blob/brewlet-2.0/specs/proposals/0009-language-agnostic-runtime-images.md
      - Source code: https://github.com/microsoft/brewlet/tree/brewlet-2.0
