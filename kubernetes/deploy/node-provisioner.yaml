# Runtime Class Manager-style node bootstrap. A privileged DaemonSet that, on
# nodes labeled brewlet.sh/provision=true (a label — it drives the nodeAffinity
# below), installs the shim binary + one or more JDK runtime roots + optional
# launcher layers (e.g. jaz), registers the containerd runtime, and labels the
# node ready. See
# See https://github.com/microsoft/brewlet/tree/main/specs.
#
# NOTE: provisioning is privileged and mutates the host.
# Do not apply on a shared/hostile cluster.
---
apiVersion: v1
kind: Namespace
metadata:
  name: brewlet
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: brewlet-node-provisioner
  namespace: brewlet
---
# The provisioner labels/annotates its Node and, for operator-managed profiles,
# verifies the owning NodeProfile immediately before publishing readiness.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: brewlet-node-provisioner
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["node.brewlet.sh"]
    resources: ["nodeprofiles"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: brewlet-node-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: brewlet-node-provisioner
subjects:
  - kind: ServiceAccount
    name: brewlet-node-provisioner
    namespace: brewlet
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: brewlet-node-provisioner
  namespace: brewlet
  labels: { app: brewlet-node-provisioner }
spec:
  selector:
    matchLabels: { app: brewlet-node-provisioner }
  template:
    metadata:
      labels: { app: brewlet-node-provisioner }
    spec:
      serviceAccountName: brewlet-node-provisioner
      # Only run on opted-in nodes.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: brewlet.sh/provision
                    operator: In
                    values: ["true"]
      hostPID: true                       # restart containerd through the host service manager
      tolerations:
        - operator: Exists
      containers:
        - name: provisioner
          image: ghcr.io/microsoft/brewlet-node-provisioner:0.1.0
          securityContext:
            privileged: true              # required to install shim + edit containerd config
          env:
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            # Editable source examples. Every image is fully qualified, tagless,
            # and pinned to an immutable SHA-256 digest.
            - name: JDK_SOURCE_COUNT
              value: "2"
            - name: JDK_SOURCE_0_TOKEN
              value: temurin-21
            - name: JDK_SOURCE_0_IMAGE
              value: docker.io/library/eclipse-temurin@sha256:85f00967bcc624fc19fa9c2cf124ea426a5363898e267141726f31f358c2e14b
            - name: JDK_SOURCE_0_JAVA_HOME
              value: /opt/java/openjdk
            - name: JDK_SOURCE_1_TOKEN
              value: microsoft-25
            - name: JDK_SOURCE_1_IMAGE
              value: mcr.microsoft.com/openjdk/jdk@sha256:bfde2ed613f4c67c112d1592452575d3a1dc9ce5f7d75821bb7752aa786fa575
            - name: JDK_SOURCE_1_JAVA_HOME
              value: /usr/lib/jvm/msopenjdk-25
            - name: LAUNCHER_SOURCE_COUNT
              value: "1"
            - name: LAUNCHER_SOURCE_0_NAME
              value: jaz
            - name: LAUNCHER_SOURCE_0_IMAGE
              value: mcr.microsoft.com/openjdk/jdk@sha256:bfde2ed613f4c67c112d1592452575d3a1dc9ce5f7d75821bb7752aa786fa575
            - name: LAUNCHER_SOURCE_0_PATH
              value: /usr/bin/jaz
            # Empty disables registry mirror rewrites in the privileged provisioner.
            - name: SOURCE_ALLOWED_MIRROR_HOSTS
              value: ""
            - name: BREWLET_APP_CDS_REGENERATION_ENABLED
              value: "false"
          volumeMounts:
            - { name: host-opt,        mountPath: /opt/brewlet }
            - { name: containerd-conf, mountPath: /etc/containerd }
            - { name: host-bin,        mountPath: /host/usr/local/bin }
            - { name: containerd-sock, mountPath: /run/containerd/containerd.sock }
      volumes:
        - { name: host-opt,        hostPath: { path: /opt/brewlet } }
        - { name: containerd-conf, hostPath: { path: /etc/containerd } }
        - { name: host-bin,        hostPath: { path: /usr/local/bin } }
        # Mounted so copy-from-image (via ctr) can reach the host containerd to
        # pull vendor JDK/launcher images and copy their runtime trees onto the host.
        - { name: containerd-sock, hostPath: { path: /run/containerd/containerd.sock, type: Socket } }
