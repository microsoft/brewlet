# Sample NodeProfile manifests. See https://github.com/microsoft/brewlet/tree/main/specs.
#
# A NodeProfile binds a node pool to a JDK/launcher inventory. Selecting a pool
# IS the opt-in: every node in the pool — present and future — is provisioned by
# a per-profile brewlet-node-provisioner DaemonSet the operator reconciles.
#
# Apply with:  kubectl apply -f deploy/sample-nodeprofile.yaml
# Inspect with: kubectl get nodeprofiles
---
# The catch-all default profile: no nodePool.names => it owns every node NOT
# claimed by a named-pool profile below. The Helm chart renders one of these for
# you from provisioner.jdks/launchers; this is what it looks like.
apiVersion: node.brewlet.sh/v1alpha1
kind: NodeProfile
metadata:
  name: default
spec:
  jdks:
    - distribution: temurin
      feature: 21
      source:
        image: docker.io/library/eclipse-temurin@sha256:85f00967bcc624fc19fa9c2cf124ea426a5363898e267141726f31f358c2e14b
        javaHome: /opt/java/openjdk
    - distribution: microsoft
      feature: 25
      source:
        image: mcr.microsoft.com/openjdk/jdk@sha256:bfde2ed613f4c67c112d1592452575d3a1dc9ce5f7d75821bb7752aa786fa575
        javaHome: /usr/lib/jvm/msopenjdk-25
  launchers:
    - name: jaz
      source:
        image: mcr.microsoft.com/openjdk/jdk@sha256:bfde2ed613f4c67c112d1592452575d3a1dc9ce5f7d75821bb7752aa786fa575
        path: /usr/bin/jaz
  rollout:
    validate: true
    containerdRestart: validated
---
# A custom distribution supplies a digest-pinned OCI image and the JDK root
# inside it. This example pins the multi-architecture Azul Zulu image index.
apiVersion: node.brewlet.sh/v1alpha1
kind: NodeProfile
metadata:
  name: zulu
spec:
  nodePool:
    names: ["zulu-workers"]
  jdks:
    - distribution: zulu
      feature: 21
      source:
        image: docker.io/library/azul-zulu@sha256:2e230d906cffcc7bb7360ce82836f2ff0e0be74a1d5ebaf929e4e6ac99d61bf2
        javaHome: /usr/lib/jvm/zulu21
  rollout:
    validate: true
    containerdRestart: validated
---
# A named-pool profile: only nodes whose resolved pool key carries one of these
# names get this inventory. The operator auto-detects the pool key (gke-nodepool
# / agentpool / eks.amazonaws.com/nodegroup / karpenter.sh/nodepool) unless you
# pin spec.nodePool.key explicitly.
apiVersion: node.brewlet.sh/v1alpha1
kind: NodeProfile
metadata:
  name: batch
spec:
  nodePool:
    names: ["batch"]
    # key: agentpool
  jdks:
    - distribution: microsoft
      feature: 25
      source:
        image: mcr.microsoft.com/openjdk/jdk@sha256:bfde2ed613f4c67c112d1592452575d3a1dc9ce5f7d75821bb7752aa786fa575
        javaHome: /usr/lib/jvm/msopenjdk-25
  launchers:
    - name: jaz
      source:
        image: mcr.microsoft.com/openjdk/jdk@sha256:bfde2ed613f4c67c112d1592452575d3a1dc9ce5f7d75821bb7752aa786fa575
        path: /usr/bin/jaz
  # Air-gapped clusters: pull immutable sources through an internal mirror. The
  # destination host must be present in the operator/admission mirror allowlist.
  registry:
    mirrors:
      mcr.microsoft.com: mirror.internal.example.com/mcr
  rollout:
    maxUnavailable: 1
    validate: true
    containerdRestart: validated
