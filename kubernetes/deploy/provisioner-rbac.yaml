# Prerequisites for operator-managed provisioning and cleanup.
# Apply before config/operator.yaml. Only NodeProfiles create host-mutating
# workers; this manifest deliberately contains no DaemonSet.
---
apiVersion: v1
kind: Namespace
metadata:
  name: brewlet
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: brewlet-node-provisioner
  namespace: brewlet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: brewlet-node-provisioner
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["node.brewlet.sh"]
    resources: ["nodeprofiles"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: brewlet-node-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: brewlet-node-provisioner
subjects:
  - kind: ServiceAccount
    name: brewlet-node-provisioner
    namespace: brewlet
