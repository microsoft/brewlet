apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodeprofiles.node.brewlet.sh
spec:
  group: node.brewlet.sh
  scope: Cluster
  names:
    plural: nodeprofiles
    singular: nodeprofile
    kind: NodeProfile
    shortNames: [np]
  versions:
    - name: v2alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec: &profileSpec
              type: object
              required: [nodePool, runtimeImages]
              properties:
                nodePool:
                  type: object
                  properties:
                    names:
                      type: array
                      x-kubernetes-list-type: set
                      items: {type: string, minLength: 1, maxLength: 63}
                    key: {type: string}
                    includeControlPlane: {type: boolean}
                runtimeImages:
                  type: array
                  minItems: 1
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [id]
                  items:
                    type: object
                    required: [id]
                    properties:
                      id:
                        type: string
                        maxLength: 55
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                      install: {type: string, enum: [Eager, OnDemand]}
                      idleTTL: {type: string}
                    x-kubernetes-validations:
                      - rule: "!has(self.idleTTL) || (has(self.install) && self.install == 'OnDemand')"
                        message: idleTTL requires OnDemand
                tolerations:
                  type: array
                  items:
                    type: object
                    required: [key]
                    properties:
                      key: {type: string, minLength: 1}
                      operator: {type: string, enum: [Equal, Exists]}
                      value: {type: string}
                      effect: {type: string, enum: [NoSchedule, NoExecute, PreferNoSchedule]}
                      tolerationSeconds: {type: integer, format: int64}
                registry:
                  type: object
                  properties:
                    mirrors:
                      type: object
                      additionalProperties: {type: string}
                rollout:
                  type: object
                  properties:
                    maxUnavailable: {type: integer, format: int32, minimum: 1}
                    containerdRestart: {type: string, enum: [validated, none]}
            status:
              type: object
              properties:
                ownershipInitialized: {type: boolean}
                assignedNodes: {type: integer, format: int32}
                readyNodes: {type: integer, format: int32}
                externalRetirementResolved: {type: boolean}
                provisioningGeneration: {type: integer, format: int64, minimum: 1}
                provisioningSpec: *profileSpec
                targets: &targets
                  type: array
                  items:
                    type: object
                    required: [name, uid, claimed, containerdRestart]
                    properties:
                      name: {type: string}
                      uid: {type: string, minLength: 1}
                      claimed: {type: boolean}
                      containerdRestart: {type: string}
                      providerID: {type: string}
                      systemUUID: {type: string}
                      retirementEvidenceName: {type: string}
                      retirementEvidenceUID: {type: string}
                retirement: &retirement
                  type: object
                  required: [targets, generation, spec, phase]
                  properties:
                    targets: *targets
                    generation: {type: integer, format: int64, minimum: 1}
                    spec: *profileSpec
                    phase: {type: string, enum: [Stopping, Cleaning, Teardown, Missing]}
                detachedRetirements:
                  type: array
                  items: *retirement
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ["True", "False", Unknown]}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string, format: date-time}
                      observedGeneration: {type: integer, format: int64}
