apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodeprofiles.node.brewlet.sh
spec:
  group: node.brewlet.sh
  names:
    kind: NodeProfile
    listKind: NodeProfileList
    plural: nodeprofiles
    singular: nodeprofile
    shortNames: [nodeprofile, np]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Pools
          type: string
          jsonPath: .spec.nodePool.names
        - name: Assigned
          type: integer
          jsonPath: .status.assignedNodes
        - name: Ready
          type: integer
          jsonPath: .status.readyNodes
        - name: Status
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [jdks]
              description: |
                Binds a node pool to a JDK inventory. See
                https://github.com/microsoft/brewlet/tree/main/specs.
                Selecting a pool IS the opt-in — every node in the pool, present and
                future, is provisioned.
              properties:
                nodePool:
                  type: object
                  description: |
                    Node pool(s) this profile provisions. Empty (no names) means
                    "every node" — the bare-metal / default-profile catch-all.
                    Control-plane nodes are excluded from every profile unless
                    includeControlPlane is true.
                  properties:
                    names:
                      type: array
                      items: { type: string }
                      description: Pool name(s), matched on the resolved pool key.
                    key:
                      type: string
                      description: |
                        Node label key carrying the pool name. Empty => the operator
                        auto-detects the provider key (gke-nodepool / agentpool /
                        nodegroup / karpenter).
                    includeControlPlane:
                      type: boolean
                      default: false
                      description: |
                        Provision nodes labelled node-role.kubernetes.io/control-plane
                        or node-role.kubernetes.io/master. Default false: the privileged
                        provisioner never lands on a control-plane node, even an
                        untainted one, unless explicitly opted in.
                jdks:
                  type: array
                  minItems: 1
                  maxItems: 32
                  description: Administrator-provided JDK roots to install on the pool's nodes.
                  items:
                    type: object
                    maxProperties: 3
                    required: [distribution, feature, source]
                    properties:
                      distribution:
                        type: string
                        maxLength: 48
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                      feature:
                        type: integer
                        minimum: 1
                        maximum: 2147483647
                      source:
                        type: object
                        maxProperties: 2
                        description: Required administrator-provided digest-pinned JDK source.
                        required: [image, javaHome]
                        x-kubernetes-validations:
                          - rule: "!self.image.contains('://')"
                            message: image must be an OCI reference without a URL scheme
                          - rule: "self.javaHome != '/' && !self.javaHome.contains('//') && !self.javaHome.contains('/./') && !self.javaHome.contains('/../') && !self.javaHome.endsWith('/.') && !self.javaHome.endsWith('/..')"
                            message: javaHome must be a clean absolute path below /
                        properties:
                          image:
                            type: string
                            minLength: 1
                            maxLength: 2048
                            pattern: '^(\[[0-9a-f:.]+\](:[0-9]+)?|localhost(:[0-9]+)?|[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+(:[0-9]+)?)/[a-z0-9][a-z0-9._/-]*@sha256:[0-9a-f]{64}$'
                            description: Fully qualified, tagless OCI image reference pinned by SHA-256 digest.
                          javaHome:
                            type: string
                            maxLength: 1024
                            pattern: '^/[^[:space:]/]+(/[^[:space:]/]+)*$'
                            description: Absolute JDK root path inside the image.
                registry:
                  type: object
                  description: Optional per-profile registry override for air-gapped clusters (§5.6).
                  properties:
                    mirrors:
                      type: object
                      additionalProperties:
                        type: string
                        pattern: '^(\[[0-9a-f:.]+\](:[0-9]+)?|localhost(:[0-9]+)?|[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+(:[0-9]+)?)(/[a-z0-9][a-z0-9._/-]*)?$'
                      description: Maps an upstream registry host to an operator-approved mirror host/path for digest-pinned ctr pulls.
                rollout:
                  type: object
                  description: DaemonSet + host-reconfig rollout policy (§5.2; mechanics from proposal 0002).
                  properties:
                    maxUnavailable:
                      x-kubernetes-int-or-string: true
                      description: Bounds the DaemonSet rolling update (default 1).
                    validate:
                      type: boolean
                      description: Gate readiness on the 0002 smoke test (default true).
                    containerdRestart:
                      type: string
                      enum: [validated, none]
                      description: How the provisioner restarts containerd; "none" is label-only / immutable-image mode.
                tolerations:
                  type: array
                  maxItems: 16
                  description: |
                    The ONLY taints the privileged provisioner DaemonSet tolerates.
                    Empty (the default) means every taint is respected, including the
                    control-plane taint. Each entry must name a key, so a blanket
                    "tolerate everything" entry cannot be expressed.
                  items:
                    type: object
                    maxProperties: 5
                    required: [key]
                    properties:
                      key:
                        type: string
                        minLength: 1
                        maxLength: 316
                        description: Taint key this profile deliberately tolerates.
                      operator:
                        type: string
                        enum: [Equal, Exists]
                        description: Equal (default) matches value; Exists matches any value of key.
                      value:
                        type: string
                        maxLength: 63
                      effect:
                        type: string
                        enum: [NoSchedule, PreferNoSchedule, NoExecute]
                        description: Empty matches all effects of the key.
                      tolerationSeconds:
                        type: integer
                        format: int64
                        description: NoExecute eviction grace period.
            status:
              type: object
              properties:
                ownershipInitialized: { type: boolean }
                provisioningGeneration: { type: integer, format: int64 }
                provisioningSpec:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                targets:
                  type: array
                  items:
                    type: object
                    required: [name, uid]
                    properties:
                      name: { type: string }
                      uid: { type: string }
                      claimed: { type: boolean }
                      containerdRestart: { type: string, enum: [validated, none] }
                      providerID: { type: string }
                      systemUUID: { type: string }
                      retirementEvidenceName: { type: string }
                      retirementEvidenceUID: { type: string }
                retirement:
                  type: object
                  required: [targets, generation, spec, phase]
                  properties:
                    generation: { type: integer, format: int64 }
                    phase: { type: string, enum: [Cleaning, Teardown] }
                    spec:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    targets:
                      type: array
                      items:
                        type: object
                        required: [name, uid]
                        properties:
                          name: { type: string }
                          uid: { type: string }
                          claimed: { type: boolean }
                          containerdRestart: { type: string, enum: [validated, none] }
                          providerID: { type: string }
                          systemUUID: { type: string }
                          retirementEvidenceName: { type: string }
                          retirementEvidenceUID: { type: string }
                detachedRetirements:
                  type: array
                  description: Missing hosts' unresolved cleanup obligations, independent of active scheduling; block finalization until resolved by retained evidence.
                  items:
                    type: object
                    required: [targets, generation, spec, phase]
                    properties:
                      generation: { type: integer, format: int64 }
                      phase: { type: string, enum: [Missing] }
                      spec:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      targets:
                        type: array
                        minItems: 1
                        maxItems: 1
                        items:
                          type: object
                          required: [name, uid, claimed]
                          properties:
                            name: { type: string, minLength: 1 }
                            uid: { type: string, minLength: 1 }
                            claimed: { type: boolean, enum: [true] }
                            containerdRestart: { type: string, enum: [validated, none] }
                            providerID: { type: string }
                            systemUUID: { type: string }
                            retirementEvidenceName: { type: string }
                            retirementEvidenceUID: { type: string }
                observedGeneration:
                  type: integer
                  format: int64
                resolvedPoolKey:
                  type: string
                assignedNodes:
                  type: integer
                readyNodes:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      observedGeneration: { type: integer, format: int64 }
                      lastTransitionTime: { type: string, format: date-time }
      subresources:
        status: {}
