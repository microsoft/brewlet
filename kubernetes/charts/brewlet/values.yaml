operator:
  image: ghcr.io/microsoft/brewlet-operator:0.12.0
  rotationRestarts:
    enabled: false
    maxConcurrent: 5
    nodeProgressDeadline: 10m
    workloadProgressDeadline: 10m
    # Optional allowlist. When set, restart patch rights are granted through a
    # Role per listed namespace instead of the cluster-wide ClusterRole.
    namespaces: []
    # Never eligible for restarts, even when allowlisted.
    protectedNamespaces: [kube-system, kube-public, kube-node-lease]
runtimeClass:
  overhead:
    cpu: "50m"
    memory: "64Mi"
provisioner:
  image: ghcr.io/microsoft/brewlet-node-provisioner:0.12.0
  profiles: []
  gc:
    grace: 1h
    sweepInterval: 1m
security:
  allowedSourceMirrorHosts: []
admission:
  enabled: true
  image: ghcr.io/microsoft/brewlet-admission:0.12.0
  nodeProfileFailurePolicy: Fail
dashboard:
  enabled: false
  image: ghcr.io/microsoft/brewlet-dashboard:0.12.0
  imagePullPolicy: IfNotPresent
  allowWrite: false
  # Empty means port-forward access only. Set an HTTPS origin for your TLS proxy.
  publicURL: ""
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
uninstall:
  timeoutSeconds: 240
metrics:
  enabled: false
  nodePort: 9090
