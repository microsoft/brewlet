operator:
  image: ghcr.io/microsoft/brewlet-operator:2.0.0-alpha.1
  rotationRestarts:
    enabled: false
    maxConcurrent: 5
    nodeProgressDeadline: 10m
    workloadProgressDeadline: 10m
    # Optional allowlist. When set, restart patch rights are granted through a
    # Role per listed namespace instead of the cluster-wide ClusterRole.
    namespaces: []
    # Never eligible for restarts, even when allowlisted.
    protectedNamespaces: [kube-system, kube-public, kube-node-lease]
    # Restarts render a ValidatingAdmissionPolicy that confines the operator's
    # workload patches to the restart barrier. Disabling this requirement on
    # clusters without ValidatingAdmissionPolicy leaves RBAC as the only bound.
    requireAdmissionPolicy: true
runtimeClass:
  overhead:
    cpu: "50m"
    memory: "64Mi"
provisioner:
  image: ghcr.io/microsoft/brewlet-node-provisioner:2.0.0-alpha.1
  profiles: []
  gc:
    grace: 1h
    sweepInterval: 1m
security:
  allowedSourceMirrorHosts: []
admission:
  enabled: true
  image: ghcr.io/microsoft/brewlet-admission:2.0.0-alpha.1
  nodeProfileFailurePolicy: Fail
uninstall:
  timeoutSeconds: 240
metrics:
  enabled: false
  nodePort: 9090
