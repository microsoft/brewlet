# Default values for the brewlet chart.
# This single-install activation combines the node/shim lifecycle role of
# SpinKube's Runtime Class Manager with the workload role of Spin Operator: it
# deploys the operator, its provisioner RBAC, and the admission webhook.
# The operator then creates/reconciles the provisioner DaemonSet + RuntimeClass
# from the `provisioner` values below (one runtime source of truth).

# Namespace all brewlet components are installed into. Created by the chart.
namespace: brewlet

# Container images for each component. Empty component values resolve to
# <registry>/brewlet-<component>@<digest> when `images.digests` records one, and
# otherwise to <registry>/brewlet-<component>:<tag>, where an empty tag uses
# Chart.appVersion. Set a component explicitly to override the generated
# reference or pin a digest.
images:
  registry: ghcr.io/microsoft
  tag: ""
  operator: ""
  provisioner: ""
  admission: ""
  # Immutable digests recorded by the release workflow for the images it built
  # and attested. Charts packaged from source leave these empty and fall back to
  # the shared tag; published charts carry `sha256:<64 hex>` values so an install
  # cannot be redirected by moving a registry tag.
  digests:
    operator: ""
    provisioner: ""
    admission: ""
  pullPolicy: IfNotPresent

# Cluster-level trust policy. NodeProfiles may request mirrors only when the
# destination registry host (including any explicit port) appears here exactly.
# Empty disables all JDK/launcher source mirrors.
security:
  allowedSourceMirrorHosts: []

# What the operator installs on the node pools you name. `provisioner.jdks/launchers`
# seed the chart-rendered **default** NodeProfile. See §5.6.
provisioner:
  # REQUIRED when defaultProfile.enabled is true: the node pool name(s) the
  # default profile provisions. There is deliberately no every-node default —
  # provisioning is privileged and mutates the host, so an install must name the
  # pools it owns. Rendering fails when this is empty.
  pools: []
  # Node label key carrying the pool name. Empty auto-detects the provider key
  # (gke-nodepool / agentpool / nodegroup / karpenter). Set it explicitly on
  # bare-metal / non-standard clusters.
  poolKey: ""
  # The only taints the privileged provisioner DaemonSet may schedule through.
  # Empty means every taint is respected. Each entry must name a key, e.g.
  #   - { key: "workload", operator: Equal, value: "java", effect: NoSchedule }
  tolerations: []
  # Provision nodes labelled node-role.kubernetes.io/control-plane (or the
  # legacy .../master). Control-plane nodes are excluded by default even when
  # untainted; enable this only for single-node development clusters (kind,
  # Docker Desktop) where the only node is the control plane.
  includeControlPlane: false
  # REQUIRED when defaultProfile.enabled is true. There is no default: Brewlet
  # ships no built-in runtime catalog (§5.2/§5.3), and the platform team chooses
  # every digest-pinned build it runs. A chart-shipped default digest could never
  # receive a CVE patch, so rendering fails instead of silently pinning a JDK
  # nobody chose.
  #
  # Every JDK must provide a fully qualified, tagless, SHA-256 digest-pinned
  # image and its JDK root path (§5.3), e.g.
  #
  #   jdks:
  #     - distribution: temurin
  #       feature: 21
  #       source:
  #         image: docker.io/library/eclipse-temurin@sha256:<64-lowercase-hex>
  #         javaHome: /opt/java/openjdk
  jdks: []
  # Optional launcher sources. Vanilla java comes from each JDK and is implicit,
  # so this may stay empty. Same digest-pinning rule as jdks, e.g.
  #
  #   launchers:
  #     - name: jaz
  #       source:
  #         image: mcr.microsoft.com/openjdk/jdk@sha256:<64-lowercase-hex>
  #         path: /usr/bin/jaz
  launchers: []
  # Node-side AppCDS archive regeneration is privileged policy and is disabled
  # unless explicitly enabled for this profile.
  appCDS:
    regenerationEnabled: false
  # Rollout policy for the default profile's provisioner DaemonSet (proposal 0002).
  rollout:
    # maxUnavailable bounds the DaemonSet rolling update. null = DaemonSet default.
    maxUnavailable: null
    # validate gates node readiness on the post-install JDK smoke test.
    validate: true
    # containerdRestart: validated | sighup | none.
    containerdRestart: validated
  # Optional registry mirrors for air-gapped pulls (§5.6): upstreamHost -> mirror.
  # Every destination host must also appear in security.allowedSourceMirrorHosts.
  registry:
    mirrors: {}

# Render the chart-managed default NodeProfile from provisioner.* above. It
# requires provisioner.pools; disable it when you manage the default profile
# yourself (e.g. GitOps).
defaultProfile:
  enabled: true

# Additional per-pool NodeProfiles rendered as CRs (§5.6). Each entry binds one or
# more node pools to their own JDK/launcher inventory. Example:
#   - name: batch
#     pools: ["batch"]        # pool name(s), matched on the resolved pool key
#     key: ""                 # optional explicit node label key (auto-detected if empty)
#     includeControlPlane: false  # opt in to control-plane nodes (off by default)
#     tolerations:            # taints this profile may schedule through
#       - { key: "workload", operator: Equal, value: "batch", effect: NoSchedule }
#     jdks:                   # one or more explicit JDK sources
#       - distribution: microsoft
#         feature: 25
#         source:
#           image: mcr.microsoft.com/openjdk/jdk@sha256:<64-lowercase-hex>
#           javaHome: /usr/lib/jvm/msopenjdk-25
#     launchers:              # optional explicit launcher sources
#       - name: jaz
#         source:
#           image: mcr.microsoft.com/openjdk/jdk@sha256:<64-lowercase-hex>
#           path: /usr/bin/jaz
#     appCDS: { regenerationEnabled: true } # explicitly authorize regeneration
#     rollout: { maxUnavailable: 1, validate: true, containerdRestart: validated }
#     registry: { mirrors: { "mcr.microsoft.com": "mirror.internal/mcr" } }
profiles: []

operator:
  replicas: 1
  leaderElect: true
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "200m", memory: "128Mi" }

metrics:
  # Opt in to Brewlet runtime and control-plane Prometheus endpoints.
  enabled: false
  nodePort: 9090
  serviceMonitor:
    # Requires the Prometheus Operator monitoring.coreos.com/v1 CRDs.
    enabled: false
    interval: 30s
    additionalLabels: {}
  grafanaDashboard:
    # Creates a ConfigMap suitable for Grafana sidecar dashboard discovery.
    enabled: false
    labels:
      grafana_dashboard: "1"

# Optional ingress isolation for Brewlet control-plane and metrics pods.
# Enabling policies requires explicit cluster-specific trusted sources.
networkPolicy:
  enabled: false
  healthProbes:
    # Kubernetes NetworkPolicy peers used by kubelet health probes. Configure
    # the node source CIDRs or selectors used by your cluster.
    ingressFrom: []
  admission:
    # Source CIDRs used by the Kubernetes API server when calling admission
    # webhooks. These vary by cluster and CNI.
    apiServerCIDRs: []
  metrics:
    # Kubernetes NetworkPolicy peers allowed to scrape Brewlet metrics. Each
    # entry may use namespaceSelector, podSelector, or ipBlock.
    ingressFrom: []

# The pod admission/scheduling webhook (§8/§14): overwrites image identity
# compatibility hints and matches a pod's requested JDK/launcher against the
# ready fleet (NoCompatibleJDK / NoCompatibleLauncher).
admission:
  enabled: true
  replicas: 1
  # failurePolicy Ignore keeps a webhook outage from ever blocking workloads.
  failurePolicy: Ignore
  # The reconciler repeats NodeProfile validation before privileged work, so
  # transport failures default to Ignore while a new certificate is issued.
  # Set Fail for synchronous rejection once webhook availability is guaranteed.
  nodeProfileFailurePolicy: Ignore
  port: 9443
  # Narrow what the cluster-wide pod webhook is consulted for. The default keeps
  # it off kube-system, where Brewlet workloads never run, so a webhook outage or
  # slow response cannot affect control-plane pods. Set to {} to match every
  # namespace. objectSelector is empty by default because a brewlet pod is
  # identified by runtimeClassName, which a label selector cannot match — set it
  # only if you label your Brewlet workloads yourself.
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values: ["kube-system"]
  objectSelector: {}
  selfSigned:
    # The dependency-free default. The certificate is reused across upgrades and
    # only regenerated once it is within renewBeforeDays of expiry.
    #
    # NOTE: nothing rotates it on its own. If no `helm upgrade` runs before it
    # expires, the webhook's TLS handshake starts failing; with the default
    # failurePolicy: Ignore that degrades silently (pods are admitted without
    # compatibility checks and without nodeAffinity). Use certManager below for
    # real auto-renewal on any long-lived cluster.
    validityDays: 90
    # Regenerate on upgrade once the certificate is within this many days of
    # expiry. Must be >= 0 and less than validityDays.
    renewBeforeDays: 30
  certManager:
    # Requires cert-manager and its CA injector to be installed in the cluster.
    enabled: false
    # Create a chart-managed self-signed CA chain. When false, issuerRef.name is
    # required and should identify an existing Issuer or ClusterIssuer.
    createSelfSignedIssuer: false
    issuerRef:
      name: ""
      kind: Issuer
      group: cert-manager.io
    duration: 2160h
    renewBefore: 720h
    caDuration: 8760h
    # Keep this longer than duration-renewBefore so a leaf renews before the
    # previous CA expires after CA rotation.
    caRenewBefore: 2160h
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "200m", memory: "128Mi" }
