{{- if .Values.admission.enabled }}
{{- $ns := include "brewlet.namespace" . -}}
{{- $svc := include "brewlet.admission.serviceName" . -}}
{{- $altNames := list (printf "%s.%s.svc" $svc $ns) (printf "%s.%s.svc.cluster.local" $svc $ns) -}}
{{- $certManagerEnabled := .Values.admission.certManager.enabled -}}
{{- $ca := dict "Cert" "" -}}
{{- $cert := dict "Cert" "" "Key" "" -}}
{{- $certRenewAfter := 0 -}}
{{- if not $certManagerEnabled -}}
{{- $validityDays := int .Values.admission.selfSigned.validityDays -}}
{{- if le $validityDays 0 -}}
{{- fail "admission.selfSigned.validityDays must be greater than zero" -}}
{{- end -}}
{{- $renewBeforeDays := int .Values.admission.selfSigned.renewBeforeDays -}}
{{- if or (lt $renewBeforeDays 0) (ge $renewBeforeDays $validityDays) -}}
{{- fail "admission.selfSigned.renewBeforeDays must be >= 0 and less than admission.selfSigned.validityDays" -}}
{{- end -}}
{{/*
Reuse the live certificate across upgrades instead of minting a new one every
time. genSignedCert is non-deterministic, so regenerating on every `helm upgrade`
rotated the serving cert and the webhook CA bundle for unrelated value changes,
briefly breaking admission while the new Secret propagated to the running pod.

The Secret records when it should next be rotated; we only regenerate once we are
inside renewBeforeDays of expiry (or the Secret is absent/unreadable, or we are
rendering without cluster access, where `lookup` returns nothing).

This does NOT make the self-signed path self-renewing: nothing rotates it unless
a `helm upgrade` runs. That is why admission.certManager is the supported
auto-renewal path for long-lived clusters — see the chart README.
*/}}
{{- $existing := lookup "v1" "Secret" $ns "brewlet-admission-selfsigned-cert" -}}
{{- $reusable := false -}}
{{- if $existing -}}
{{- $ann := default (dict) $existing.metadata.annotations -}}
{{- $renewAfter := int (default "0" (get $ann "brewlet.sh/cert-renew-after")) -}}
{{- $data := default (dict) $existing.data -}}
{{- if and (gt $renewAfter (int (now | unixEpoch)))
           (get $data "tls.crt") (get $data "tls.key") (get $ann "brewlet.sh/ca-cert") -}}
{{- $reusable = true -}}
{{- $ca = dict "Cert" (b64dec (get $ann "brewlet.sh/ca-cert")) -}}
{{- $cert = dict "Cert" (b64dec (get $data "tls.crt")) "Key" (b64dec (get $data "tls.key")) -}}
{{- $certRenewAfter = $renewAfter -}}
{{- end -}}
{{- end -}}
{{- if not $reusable -}}
{{- $ca = genCA "brewlet-admission-ca" $validityDays -}}
{{- $cert = genSignedCert $svc nil $altNames $validityDays $ca -}}
{{- $certRenewAfter = add (int (now | unixEpoch)) (mul (sub $validityDays $renewBeforeDays) 86400) -}}
{{- end -}}
{{- end -}}
{{/*
brewlet-admission: the pod admission/scheduling webhook (§8/§14). It overwrites
brewlet.sh/artifact-ref + artifact-digest compatibility hints from the selected
Pod image, and matches a pod's requested JDK/launcher against the ready node fleet
(NoCompatibleJDK / NoCompatibleLauncher), steering scheduling via nodeAffinity.

By default, the serving cert is generated at render time. cert-manager mode
instead owns the Secret and injects the webhook CA bundle automatically.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: brewlet-admission
  namespace: {{ $ns }}
  labels:
    {{- include "brewlet.labels" . | nindent 4 }}
---
# The webhook lists Nodes to evaluate the ready fleet.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: brewlet-admission
  labels:
    {{- include "brewlet.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["node.brewlet.sh"]
    resources: ["nodeprofiles"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: brewlet-admission
  labels:
    {{- include "brewlet.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: brewlet-admission
subjects:
  - kind: ServiceAccount
    name: brewlet-admission
    namespace: {{ $ns }}
---
{{- if not $certManagerEnabled }}
apiVersion: v1
kind: Secret
metadata:
  name: brewlet-admission-selfsigned-cert
  namespace: {{ $ns }}
  labels:
    {{- include "brewlet.labels" . | nindent 4 }}
  annotations:
    # Unix time after which the next `helm upgrade` mints a fresh certificate.
    # Nothing rotates it on its own — use admission.certManager for that.
    brewlet.sh/cert-renew-after: {{ $certRenewAfter | quote }}
    # The issuing CA, so an upgrade that reuses this cert can re-derive the
    # webhook caBundle without regenerating (and invalidating) the chain.
    brewlet.sh/ca-cert: {{ $ca.Cert | b64enc | quote }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc }}
  namespace: {{ $ns }}
  labels:
    {{- include "brewlet.labels" . | nindent 4 }}
    {{- if .Values.metrics.enabled }}
    brewlet.sh/metrics: "true"
    {{- end }}
spec:
  selector: { app: brewlet-admission }
  ports:
    - name: https
      port: 443
      targetPort: {{ .Values.admission.port }}
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: 8080
      targetPort: metrics
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brewlet-admission
  namespace: {{ $ns }}
  labels:
    {{- include "brewlet.labels" . | nindent 4 }}
    app: brewlet-admission
spec:
  replicas: {{ .Values.admission.replicas }}
  selector:
    matchLabels: { app: brewlet-admission }
  template:
    metadata:
      labels:
        {{- include "brewlet.labels" . | nindent 8 }}
        app: brewlet-admission
      {{- if not $certManagerEnabled }}
      annotations:
        # Roll the pods whenever the serving cert changes.
        checksum/cert: {{ $cert.Cert | sha256sum }}
      {{- end }}
    spec:
      serviceAccountName: brewlet-admission
      securityContext:
        runAsNonRoot: true
      containers:
        - name: webhook
          image: {{ include "brewlet.image" (dict "root" . "component" "admission" "name" "brewlet-admission") | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - --webhook-port={{ .Values.admission.port }}
            - --cert-dir=/tmp/k8s-webhook-server/serving-certs
            - --health-probe-bind-address=:8081
            - {{ printf "--allowed-source-mirror-hosts=%s" (join "," .Values.security.allowedSourceMirrorHosts) | quote }}
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:8080
            {{- else }}
            - --metrics-bind-address=0
            {{- end }}
          ports:
            - { name: https, containerPort: {{ .Values.admission.port }} }
            {{- if .Values.metrics.enabled }}
            - { name: metrics, containerPort: 8080 }
            {{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.admission.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: serving-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: serving-certs
          secret:
            {{- if $certManagerEnabled }}
            secretName: brewlet-admission-cert
            {{- else }}
            secretName: brewlet-admission-selfsigned-cert
            {{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: brewlet-admission
  labels:
    {{- include "brewlet.labels" . | nindent 4 }}
  {{- if $certManagerEnabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ printf "%s/brewlet-admission-cert" $ns | quote }}
  {{- end }}
webhooks:
  - name: pods.brewlet.sh
    admissionReviewVersions: ["v1"]
    sideEffects: None
    # Ignore keeps a webhook outage from blocking workloads; the shim still
    # enforces runtime image identity and JDK/launcher compatibility.
    failurePolicy: {{ .Values.admission.failurePolicy }}
    clientConfig:
      service:
        name: {{ $svc }}
        namespace: {{ $ns }}
        path: /mutate-pods
        port: 443
      {{- if not $certManagerEnabled }}
      caBundle: {{ $ca.Cert | b64enc }}
      {{- end }}
    # This webhook is cluster-wide on pod CREATE, so narrow what the API server
    # must consult it for. The default excludes kube-system: brewlet workloads
    # never run there, and keeping a webhook off control-plane-critical pods
    # bounds the blast radius of an outage or a slow response. Set either
    # selector to {} to match everything.
    {{- with .Values.admission.namespaceSelector }}
    namespaceSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.admission.objectSelector }}
    objectSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: brewlet-nodeprofiles
  labels:
    {{- include "brewlet.labels" . | nindent 4 }}
  {{- if $certManagerEnabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ printf "%s/brewlet-admission-cert" $ns | quote }}
  {{- end }}
webhooks:
  - name: nodeprofiles.node.brewlet.sh
    admissionReviewVersions: ["v1"]
    sideEffects: None
    # The reconciler repeats this validation before privileged work. Ignore is
    # safe during certificate bootstrap; Fail can be selected for synchronous
    # transport-failure rejection once webhook availability is guaranteed.
    failurePolicy: {{ .Values.admission.nodeProfileFailurePolicy }}
    clientConfig:
      service:
        name: {{ $svc }}
        namespace: {{ $ns }}
        path: /validate-nodeprofiles
        port: 443
      {{- if not $certManagerEnabled }}
      caBundle: {{ $ca.Cert | b64enc }}
      {{- end }}
    rules:
      - apiGroups: ["node.brewlet.sh"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["nodeprofiles"]
        scope: Cluster
{{- end }}
