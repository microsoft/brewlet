{{- $timeoutText := toString .Values.uninstall.timeoutSeconds }}
{{- $timeout := int64 .Values.uninstall.timeoutSeconds }}
{{- if or (not (regexMatch "^[1-9][0-9]*$" $timeoutText)) (lt $timeout 1) (gt $timeout 86400) }}
{{- fail "uninstall.timeoutSeconds must be a whole number between 1 and 86400" }}
{{- end }}
{{- $name := include "brewlet.uninstallName" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ include "brewlet.namespace" . }}
  labels:
    {{- include "brewlet.labels" . | nindent 4 }}
  annotations:
    {{- include "brewlet.uninstallAnnotations" "-30" | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "brewlet.labels" . | nindent 4 }}
  annotations:
    {{- include "brewlet.uninstallAnnotations" "-20" | nindent 4 }}
rules:
  - apiGroups: ["node.brewlet.sh"]
    resources: ["nodeprofiles"]
    verbs: ["list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "brewlet.labels" . | nindent 4 }}
  annotations:
    {{- include "brewlet.uninstallAnnotations" "-10" | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ include "brewlet.namespace" . }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ include "brewlet.namespace" . }}
  labels:
    {{- include "brewlet.labels" . | nindent 4 }}
    app: brewlet-uninstall
  annotations:
    {{- include "brewlet.uninstallAnnotations" "0" | nindent 4 }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ add $timeout 20 }}
  template:
    metadata:
      labels:
        {{- include "brewlet.labels" . | nindent 8 }}
        app: brewlet-uninstall
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      terminationGracePeriodSeconds: 10
      nodeSelector:
        kubernetes.io/os: linux
      {{- with .Values.uninstall.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cleanup
          image: {{ include "brewlet.image" (dict "root" . "component" "operator" "name" "brewlet-operator") | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - {{ printf "--namespace=%s" (include "brewlet.namespace" .) | quote }}
            - {{ printf "--uninstall-release-name=%s" .Release.Name | quote }}
            - {{ printf "--uninstall-release-namespace=%s" .Release.Namespace | quote }}
            - {{ printf "--uninstall-timeout=%ds" $timeout | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
