apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: brewlet
  annotations:
    helm.sh/resource-policy: keep
handler: brewlet
overhead:
  podFixed:
    memory: {{ .Values.runtimeClass.overhead.memory | quote }}
    cpu: {{ .Values.runtimeClass.overhead.cpu | quote }}
scheduling:
  nodeSelector:
    brewlet.sh/runtime: ready
