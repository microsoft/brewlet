apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodeprofiles.node.brewlet.sh
spec:
  group: node.brewlet.sh
  names:
    kind: NodeProfile
    listKind: NodeProfileList
    plural: nodeprofiles
    singular: nodeprofile
    shortNames: [nodeprofile, np]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Pools
          type: string
          jsonPath: .spec.nodePool.names
        - name: Assigned
          type: integer
          jsonPath: .status.assignedNodes
        - name: Ready
          type: integer
          jsonPath: .status.readyNodes
        - name: Status
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [jdks]
              description: |
                Binds a node pool to a JDK/launcher inventory. See
                https://github.com/microsoft/brewlet/tree/main/specs.
                Selecting a pool IS the opt-in — every node in the pool, present and
                future, is provisioned.
              properties:
                nodePool:
                  type: object
                  description: |
                    Node pool(s) this profile provisions. Empty (no names) means
                    "every node" — the bare-metal / default-profile catch-all.
                  properties:
                    names:
                      type: array
                      items: { type: string }
                      description: Pool name(s), matched on the resolved pool key.
                    key:
                      type: string
                      description: |
                        Node label key carrying the pool name. Empty => the operator
                        auto-detects the provider key (gke-nodepool / agentpool /
                        nodegroup / karpenter).
                jdks:
                  type: array
                  minItems: 1
                  maxItems: 32
                  description: Administrator-provided JDK roots to install on the pool's nodes.
                  items:
                    type: object
                    maxProperties: 3
                    required: [distribution, feature, source]
                    properties:
                      distribution:
                        type: string
                        maxLength: 48
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                      feature:
                        type: integer
                        minimum: 1
                        maximum: 2147483647
                      source:
                        type: object
                        maxProperties: 2
                        description: Required administrator-provided digest-pinned JDK source.
                        required: [image, javaHome]
                        x-kubernetes-validations:
                          - rule: "!self.image.contains('://')"
                            message: image must be an OCI reference without a URL scheme
                          - rule: "self.javaHome != '/' && !self.javaHome.contains('//') && !self.javaHome.contains('/./') && !self.javaHome.contains('/../') && !self.javaHome.endsWith('/.') && !self.javaHome.endsWith('/..')"
                            message: javaHome must be a clean absolute path below /
                        properties:
                          image:
                            type: string
                            minLength: 1
                            maxLength: 2048
                            pattern: '^(\[[0-9a-f:.]+\](:[0-9]+)?|localhost(:[0-9]+)?|[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+(:[0-9]+)?)/[a-z0-9][a-z0-9._/-]*@sha256:[0-9a-f]{64}$'
                            description: Fully qualified, tagless OCI image reference pinned by SHA-256 digest.
                          javaHome:
                            type: string
                            maxLength: 1024
                            pattern: '^/[^[:space:]/]+(/[^[:space:]/]+)*$'
                            description: Absolute JDK root path inside the image.
                launchers:
                  type: array
                  maxItems: 32
                  description: Optional administrator-provided launcher layers. "java" comes from each JDK and must not be listed.
                  items:
                    type: object
                    maxProperties: 2
                    required: [name, source]
                    x-kubernetes-validations:
                      - rule: "self.name != 'java'"
                        message: java is provided by every JDK and must not be listed
                    properties:
                      name:
                        type: string
                        maxLength: 54
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                      source:
                        type: object
                        maxProperties: 2
                        required: [image, path]
                        x-kubernetes-validations:
                          - rule: "!self.image.contains('://')"
                            message: image must be an OCI reference without a URL scheme
                          - rule: "self.path != '/' && !self.path.contains('//') && !self.path.contains('/./') && !self.path.contains('/../') && !self.path.endsWith('/.') && !self.path.endsWith('/..')"
                            message: path must be a clean absolute path below /
                        properties:
                          image:
                            type: string
                            minLength: 1
                            maxLength: 2048
                            pattern: '^(\[[0-9a-f:.]+\](:[0-9]+)?|localhost(:[0-9]+)?|[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+(:[0-9]+)?)/[a-z0-9][a-z0-9._/-]*@sha256:[0-9a-f]{64}$'
                            description: Fully qualified, tagless OCI image reference pinned by SHA-256 digest.
                          path:
                            type: string
                            maxLength: 1024
                            pattern: '^/[^[:space:]/]+(/[^[:space:]/]+)*$'
                            description: Absolute launcher binary path inside the image.
                appCDS:
                  type: object
                  maxProperties: 1
                  description: Node-side AppCDS policy. Omitted means regeneration is disabled.
                  properties:
                    regenerationEnabled:
                      type: boolean
                      default: false
                      description: Authorize node-side AppCDS archive regeneration (default false).
                registry:
                  type: object
                  description: Optional per-profile registry override for air-gapped clusters (§5.6).
                  properties:
                    mirrors:
                      type: object
                      additionalProperties:
                        type: string
                        pattern: '^(\[[0-9a-f:.]+\](:[0-9]+)?|localhost(:[0-9]+)?|[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+(:[0-9]+)?)(/[a-z0-9][a-z0-9._/-]*)?$'
                      description: Maps an upstream registry host to an operator-approved mirror host/path for digest-pinned ctr pulls.
                rollout:
                  type: object
                  description: DaemonSet + host-reconfig rollout policy (§5.2; mechanics from proposal 0002).
                  properties:
                    maxUnavailable:
                      x-kubernetes-int-or-string: true
                      description: Bounds the DaemonSet rolling update (default 1).
                    validate:
                      type: boolean
                      description: Gate readiness on the 0002 smoke test (default true).
                    containerdRestart:
                      type: string
                      enum: [validated, sighup, none]
                      description: How the provisioner restarts containerd; "none" is label-only / immutable-image mode.
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                resolvedPoolKey:
                  type: string
                assignedNodes:
                  type: integer
                readyNodes:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      observedGeneration: { type: integer, format: int64 }
                      lastTransitionTime: { type: string, format: date-time }
      subresources:
        status: {}
