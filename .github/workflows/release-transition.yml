name: Brewlet disposable prerelease reinstall qualification

on:
  workflow_call:
    inputs:
      candidate_run:
        type: string
        required: true
      architecture:
        type: string
        required: true
      authorization:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful release-build run at this exact source SHA
        type: string
        required: true
      architecture:
        description: Native disposable Linux architecture
        type: choice
        options: [amd64, arm64]
        required: true
      authorization:
        description: Type authorize-disposable-drain-reinstall to authorize this destructive private fixture scope
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  transition:
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Require explicit disposable-scope authorization
        env:
          AUTHORIZATION: ${{ inputs.authorization }}
          EVENT: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          test "$AUTHORIZATION" = authorize-disposable-drain-reinstall
          test "$EVENT" = workflow_dispatch
          test "$REPOSITORY" = microsoft/brewlet
          case "$ARCHITECTURE" in amd64|arm64) ;; *) exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.0"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.22.0"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: integration-tests/fixtures/dotnet/global.json
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v3.19.0
      - uses: Azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede
        with:
          version: v1.35.0
      - name: Install pinned tools without persistent credentials
        run: |
          python3 scripts/release_tools.py --destination "$RUNNER_TEMP/release-tools" ghx
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
          go install sigs.k8s.io/kind@v0.33.0
      - name: Authenticate source workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          SOURCE: ${{ github.sha }}
        run: python3 scripts/release_run.py "$CANDIDATE_RUN" --workflow release-build.yml --source "$SOURCE"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-candidate-${{ github.sha }}
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: dist/candidate
      - name: Verify signed candidate and offline lifecycle safeguards
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.sha }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          ghx attestation verify dist/candidate/candidate.json --repo microsoft/brewlet \
            --signer-workflow microsoft/brewlet/.github/workflows/release-build.yml \
            --source-digest "$SOURCE" --signer-digest "$SOURCE" --deny-self-hosted-runners
          python3 scripts/release.py verify
          python3 scripts/release_assurance.py verify
          python3 -m unittest discover -s integration-tests/live-v2 -p 'test_*.py' -q
      - name: Execute only the owned disposable transition
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          RUN_ID: ${{ github.run_id }}
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          python3 integration-tests/live-v2/release_transition.py \
            --candidate dist/candidate \
            --work "integration-tests/live-v2/run-release-$RUN_ID-$ARCHITECTURE" \
            --authorize-disposable-transition
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/candidate/evidence/transition-*.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-transition-${{ inputs.architecture }}
          path: dist/candidate/evidence/transition-*.json
          if-no-files-found: error
          retention-days: 30
