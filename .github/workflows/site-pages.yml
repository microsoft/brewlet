name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/site-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/site-pages.yml"
  workflow_dispatch:
    inputs:
      skip_release_smoke:
        description: Skip validation of public release artifacts
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deployment' }}
  cancel-in-progress: true

jobs:
  release-smoke:
    name: Release documentation smoke test
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_release_smoke }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify installer, public release, and Getting Started
        run: ./site/scripts/verify-release-artifacts.sh 0.3.1

  site-check:
    name: Site check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/notices/package-lock.json
      - name: Build docs site
        run: |
          python -m pip install --upgrade pip
          pip install --quiet -r site/requirements.txt
          npm ci --ignore-scripts --prefix site/notices
          python site/scripts/generate-notice.py
          git diff --exit-code -- site/NOTICE.txt
          python -m mkdocs build --strict -f site/mkdocs.yml
      - name: Assemble publish directory
        run: |
          mkdir -p site/_site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='docs' \
            --exclude='_site' \
            --exclude='notices' \
            site/ site/_site/
      - name: Verify publish directory
        run: test -s site/_site/index.html
      - name: Save publish directory
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site-publish
          path: site/_site
          if-no-files-found: error

  deploy:
    if: ${{ always() && github.event_name != 'pull_request' && (needs.release-smoke.result == 'success' || needs.release-smoke.result == 'skipped') }}
    needs: [release-smoke, site-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site-publish
          path: site/_site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site
      - id: deployment
        uses: actions/deploy-pages@v5
