name: Brewlet real-node E2E

on:
  workflow_call:
    inputs:
      expected_sha:
        type: string
        required: true
      scenario:
        type: string
        default: pr
      architecture:
        type: string
        default: amd64
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact immutable commit authorized for this invocation
        type: string
        required: true
      scenario:
        description: PR/debug execution or full promotion scopes
        type: choice
        required: true
        default: pr
        options: [pr, complete, control, managed, managed-wasm]
      architecture:
        description: Execute on the actual native architecture, not emulation
        type: choice
        required: true
        default: amd64
        options: [amd64, arm64]

permissions:
  contents: read

jobs:
  execution:
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ARCHITECTURE: ${{ inputs.architecture }}
    steps:
      - name: Refuse unsupported execution contexts instead of skipping
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          REF: ${{ github.ref }}
          SOURCE: ${{ env.SOURCE_SHA }}
          EXPECTED_SOURCE: ${{ inputs.expected_sha }}
          SCENARIO: ${{ inputs.scenario }}
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          test "$REPOSITORY" = microsoft/brewlet
          case "$SCENARIO" in pr|complete|control|managed|managed-wasm) ;; *) exit 1 ;; esac
          case "$ARCHITECTURE" in amd64|arm64) ;; *) exit 1 ;; esac
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE" = "$EXPECTED_SOURCE"
          case "$EVENT" in
            pull_request)
              test "$SCENARIO" = pr
              test "$HEAD_REPOSITORY" = "$REPOSITORY"
              case "$REF" in refs/pull/*/merge) ;; *) exit 1 ;; esac
              ;;
            schedule)
              test "$SCENARIO" = pr
              test "$REF" = refs/heads/main
              ;;
            push)
              # Full validation called by the release workflow for a version tag.
              test "$SCENARIO" = pr
              case "$REF" in refs/tags/v*) ;; *) exit 1 ;; esac
              ;;
            workflow_dispatch)
              case "$REF" in refs/heads/*) ;; *) exit 1 ;; esac
              ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: ${{ inputs.scenario != 'pr' }}
      - name: Restore PR E2E host Go caches
        if: inputs.scenario == 'pr'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: e2e-host-go-${{ inputs.architecture }}-${{ hashFiles('go.sum') }}
          restore-keys: e2e-host-go-${{ inputs.architecture }}-
      - name: Restore PR E2E image Go build cache
        id: image-go-cache
        if: inputs.scenario == 'pr'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/image-go-build
          key: e2e-image-go-build-${{ inputs.architecture }}-${{ hashFiles('go.sum', 'kubernetes/Dockerfile', 'provisioner/Dockerfile') }}
          restore-keys: e2e-image-go-build-${{ inputs.architecture }}-
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v3.19.0
      - uses: Azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e
        with:
          version: v1.35.0
      - name: Install pinned native suite tools
        run: |
          go install sigs.k8s.io/kind@v0.33.0
          command -v htpasswd
      - name: Install pinned WebAssembly toolchain for promotion companions
        if: inputs.scenario == 'complete' || inputs.scenario == 'managed-wasm'
        run: rustup toolchain install 1.97.1 --profile minimal --target wasm32-wasip2
      - name: Seed BuildKit Go build cache mount for PR E2E
        if: inputs.scenario == 'pr'
        run: |
          cache="$RUNNER_TEMP/image-go-build"
          mkdir -p "$cache"
          image="$(sed -n 's/^FROM --platform=\$BUILDPLATFORM \(golang:[^ ]*\) AS build$/\1/p' kubernetes/Dockerfile)"
          if test -n "$image" && test "$image" = "$(sed -n 's/^FROM --platform=\$BUILDPLATFORM \(golang:[^ ]*\) AS build$/\1/p' provisioner/Dockerfile)" &&
              printf 'FROM %s\nRUN --mount=type=cache,target=/root/.cache/go-build --mount=type=bind,target=/seed cp -a /seed/. /root/.cache/go-build/\n' "$image" |
              docker build --quiet --iidfile "$RUNNER_TEMP/seed.iid" -f - "$cache"; then
            docker image rm "$(cat "$RUNNER_TEMP/seed.iid")" > /dev/null || true
          else
            echo "::warning::Image Go build cache was not seeded; image builds compile cold"
          fi
      - name: Execute real PR E2E including protected identity and cleanup
        if: inputs.scenario == 'pr'
        run: |
          python3 integration-tests/live-v2/harness.py --scenario pr \
            --work "integration-tests/live-v2/run-pr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCHITECTURE}"
      - name: Extract BuildKit Go build cache mount after successful PR E2E
        if: success() && inputs.scenario == 'pr' && steps.image-go-cache.outputs.cache-hit != 'true'
        run: |
          cache="$RUNNER_TEMP/image-go-build"
          image="$(sed -n 's/^FROM --platform=\$BUILDPLATFORM \(golang:[^ ]*\) AS build$/\1/p' kubernetes/Dockerfile)"
          rm -rf "$cache"
          if ! test -n "$image" ||
              ! printf 'FROM %s AS cache\nRUN --mount=type=cache,target=/root/.cache/go-build mkdir /out && cp -a /root/.cache/go-build/. /out/\nFROM scratch\nCOPY --from=cache /out /\n' "$image" |
              docker build --quiet --output "type=local,dest=$cache" -; then
            rm -rf "$cache"
            echo "::warning::Image Go build cache was not extracted; it will not be saved"
          fi
      - name: Export only public PR outcomes
        if: always() && steps.guard.outcome == 'success' && inputs.scenario == 'pr'
        run: |
          mkdir -p acceptance-export
          python3 acceptance/export_result.py \
            "integration-tests/live-v2/run-pr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCHITECTURE}/result.json" \
            "acceptance-export/pr-e2e-${ARCHITECTURE}.json"
          python3 acceptance/qualify.py \
            --verify-pr "acceptance-export/pr-e2e-${ARCHITECTURE}.json" \
            --architecture "$ARCHITECTURE"
      - name: Execute immutable native candidate qualification
        if: inputs.scenario != 'pr'
        env:
          SCENARIO: ${{ inputs.scenario }}
          ARCHITECTURE: ${{ inputs.architecture }}
        run: python3 acceptance/qualify.py --run --scenario "$SCENARIO" --architecture "$ARCHITECTURE"
      - name: Retain public identities/outcomes only, never private work files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-${{ inputs.architecture }}-${{ inputs.scenario }}-${{ env.SOURCE_SHA }}
          path: acceptance-export/*.json
          if-no-files-found: error
          retention-days: 14
