name: Kubernetes E2E

on:
  schedule:
    - cron: "17 4 * * 3" # Wednesday, UTC
  workflow_call:
    inputs:
      expected_sha:
        type: string
        required: true
      scenario:
        type: string
        default: pr
      architecture:
        type: string
        default: amd64
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact immutable commit authorized for this invocation
        type: string
        required: true
      scenario:
        description: All nine suites (complete), PR baseline, or focused control checks
        type: choice
        required: true
        default: complete
        options: [pr, complete, control]
      architecture:
        description: Execute on the actual native architecture, not emulation
        type: choice
        required: true
        default: both
        options: [both, amd64, arm64]

permissions:
  contents: read

jobs:
  context:
    runs-on: ubuntu-24.04
    outputs:
      architectures: ${{ steps.guard.outputs.architectures }}
      scenario: ${{ steps.guard.outputs.scenario }}
      source: ${{ steps.guard.outputs.source }}
    steps:
      - name: Refuse unsupported execution contexts instead of skipping
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          REF: ${{ github.ref }}
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_SOURCE: ${{ inputs.expected_sha }}
          SCENARIO: ${{ inputs.scenario }}
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          test "$REPOSITORY" = microsoft/brewlet
          case "$EVENT" in
            pull_request)
              test "$SCENARIO" = pr
              test "$HEAD_REPOSITORY" = "$REPOSITORY"
              case "$REF" in refs/pull/*/merge) ;; *) exit 1 ;; esac
              ;;
            schedule)
              test "$REF" = refs/heads/main
              # The standalone cron has no inputs. The scheduled Release Gate
              # Tests caller instead supplies its exact SHA and PR baseline.
              if test -z "$EXPECTED_SOURCE" && test -z "$SCENARIO" && test -z "$ARCHITECTURE"; then
                EXPECTED_SOURCE=$SOURCE
                SCENARIO=complete
                ARCHITECTURE=both
              else
                test "$SCENARIO" = pr
              fi
              ;;
            push)
              # Release Gate Tests, called by the release workflow for a version tag.
              test "$SCENARIO" = pr
              case "$REF" in refs/tags/v*) ;; *) exit 1 ;; esac
              ;;
            workflow_dispatch)
              case "$REF" in refs/heads/*) ;; *) exit 1 ;; esac
              ;;
            *) exit 1 ;;
          esac
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE" = "$EXPECTED_SOURCE"
          case "$SCENARIO" in pr|complete|control) ;; *) exit 1 ;; esac
          case "$ARCHITECTURE" in
            amd64|arm64) architectures="[\"$ARCHITECTURE\"]" ;;
            both) architectures='["amd64","arm64"]' ;;
            *) exit 1 ;;
          esac
          {
            echo "architectures=$architectures"
            echo "scenario=$SCENARIO"
            echo "source=$SOURCE"
          } >> "$GITHUB_OUTPUT"

  execution:
    name: ${{ needs.context.outputs.scenario }} (${{ matrix.architecture }})
    needs: context
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(needs.context.outputs.architectures) }}
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SOURCE_SHA: ${{ needs.context.outputs.source }}
      SCENARIO: ${{ needs.context.outputs.scenario }}
      ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache: ${{ env.SCENARIO != 'pr' }}
      - name: Restore PR E2E host Go caches
        if: env.SCENARIO == 'pr'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: e2e-host-go-${{ matrix.architecture }}-${{ hashFiles('go.sum') }}
          restore-keys: e2e-host-go-${{ matrix.architecture }}-
      - name: Restore PR E2E image Go build cache
        id: image-go-cache
        if: env.SCENARIO == 'pr'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/image-go-build
          key: e2e-image-go-build-${{ matrix.architecture }}-${{ hashFiles('go.sum', 'kubernetes/Dockerfile', 'provisioner/Dockerfile') }}
          restore-keys: e2e-image-go-build-${{ matrix.architecture }}-
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e
        with:
          version: v3.19.0
      - uses: Azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e
        with:
          version: v1.35.0
      - name: Install pinned native suite tools
        run: |
          go install sigs.k8s.io/kind@v0.33.0
          command -v htpasswd
      - name: Install pinned WebAssembly toolchain for promotion companions
        if: env.SCENARIO == 'complete'
        run: rustup toolchain install 1.97.1 --profile minimal --target wasm32-wasip2
      - name: Seed BuildKit Go build cache mount for PR E2E
        if: env.SCENARIO == 'pr'
        run: |
          cache="$RUNNER_TEMP/image-go-build"
          mkdir -p "$cache"
          image="$(sed -n 's/^FROM --platform=\$BUILDPLATFORM \(golang:[^ ]*\) AS build$/\1/p' kubernetes/Dockerfile)"
          if test -n "$image" && test "$image" = "$(sed -n 's/^FROM --platform=\$BUILDPLATFORM \(golang:[^ ]*\) AS build$/\1/p' provisioner/Dockerfile)" &&
              printf 'FROM %s\nRUN --mount=type=cache,target=/root/.cache/go-build --mount=type=bind,target=/seed cp -a /seed/. /root/.cache/go-build/\n' "$image" |
              docker build --quiet --iidfile "$RUNNER_TEMP/seed.iid" -f - "$cache"; then
            docker image rm "$(cat "$RUNNER_TEMP/seed.iid")" > /dev/null || true
          else
            echo "::warning::Image Go build cache was not seeded; image builds compile cold"
          fi
      - name: Execute real PR E2E including protected identity and cleanup
        if: env.SCENARIO == 'pr'
        run: |
          python3 integration-tests/live-v2/harness.py --scenario pr \
            --work "integration-tests/live-v2/run-pr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCHITECTURE}"
      - name: Extract BuildKit Go build cache mount after successful PR E2E
        if: success() && env.SCENARIO == 'pr' && steps.image-go-cache.outputs.cache-hit != 'true'
        run: |
          cache="$RUNNER_TEMP/image-go-build"
          image="$(sed -n 's/^FROM --platform=\$BUILDPLATFORM \(golang:[^ ]*\) AS build$/\1/p' kubernetes/Dockerfile)"
          rm -rf "$cache"
          if ! test -n "$image" ||
              ! printf 'FROM %s AS cache\nRUN --mount=type=cache,target=/root/.cache/go-build mkdir /out && cp -a /root/.cache/go-build/. /out/\nFROM scratch\nCOPY --from=cache /out /\n' "$image" |
              docker build --quiet --output "type=local,dest=$cache" -; then
            rm -rf "$cache"
            echo "::warning::Image Go build cache was not extracted; it will not be saved"
          fi
      - name: Export only public PR outcomes
        if: always() && env.SCENARIO == 'pr'
        run: |
          mkdir -p acceptance-export
          python3 acceptance/export_result.py \
            "integration-tests/live-v2/run-pr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCHITECTURE}/result.json" \
            "acceptance-export/pr-e2e-${ARCHITECTURE}.json"
          python3 acceptance/qualify.py \
            --verify-pr "acceptance-export/pr-e2e-${ARCHITECTURE}.json" \
            --architecture "$ARCHITECTURE"
      - name: Execute immutable native candidate qualification
        if: env.SCENARIO != 'pr'
        run: python3 acceptance/qualify.py --run --scenario "$SCENARIO" --architecture "$ARCHITECTURE"
      - name: Retain public identities/outcomes only, never private work files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-${{ matrix.architecture }}-${{ env.SCENARIO }}-${{ env.SOURCE_SHA }}
          path: acceptance-export/*.json
          if-no-files-found: error
          retention-days: 14
