name: Brewlet 2 real-node execution

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Complete acceptance or explicitly partial control/cleanup debugging
        type: choice
        required: true
        default: complete
        options: [complete, control]

permissions:
  contents: read

jobs:
  execution:
    if: github.ref_name == 'brewlet-2.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.22.0"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: integration-tests/fixtures/dotnet/global.json
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v3.19.0
      - uses: Azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415
        with:
          version: v1.35.0
      - name: Install pinned kind
        run: go install sigs.k8s.io/kind@v0.33.0
      - name: Offline harness ownership and evidence safeguards
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s integration-tests/live-v2 -p 'test_*.py' -v
      - name: Real TLS pulls, runtime updates, lifecycle, controllers and CRI eviction
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          BREWLET_LIVE_SCENARIO: ${{ inputs.scenario }}
        run: python3 integration-tests/live-v2/harness.py --scenario "$BREWLET_LIVE_SCENARIO" --work integration-tests/live-v2/run-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Real two-node cold-install deadline and recovery
        if: inputs.scenario == 'complete'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 integration-tests/live-v2/cold_install.py --work integration-tests/live-v2/run-cold-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Unchanged distroless sources, numeric identity, isolated app and shell-free recovery
        if: inputs.scenario == 'complete'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 integration-tests/live-v2/upstream.py --work integration-tests/live-v2/run-upstream-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Native pending capacity, boot fencing and unsupported pull
        if: inputs.scenario == 'complete'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 integration-tests/live-v2/native_capacity.py --work integration-tests/live-v2/run-native-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Real Helm uninstall behind stale provider pins
        if: inputs.scenario == 'complete'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 integration-tests/live-v2/pinned_uninstall.py --work integration-tests/live-v2/run-uninstall-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Real worker decommission, replacement and retained external history
        if: inputs.scenario == 'complete'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 integration-tests/live-v2/retirement.py --work integration-tests/live-v2/run-retirement-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Real retention, cache, orphan Exec, retry and signal lifecycle
        if: inputs.scenario == 'complete'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 integration-tests/live-v2/activation.py --work integration-tests/live-v2/run-activation-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Export only public identities and outcomes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-export
          for result in integration-tests/live-v2/run-*/result.json; do
            test -f "$result" || continue
            run_name="$(basename "$(dirname "$result")")"
            python3 acceptance/export_result.py "$result" "acceptance-export/$run_name.json"
          done
      - name: Retain public results only, never kubeconfigs or keys
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-node-execution-results
          path: acceptance-export/*.json
          if-no-files-found: error
          retention-days: 14
