name: E2E

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Scenarios to run
        type: choice
        options: [all, live, legacy]
        default: all
      candidate:
        description: Live runtime (release reproduces the 0.5.0 packed-layer GC failure)
        type: choice
        options: [shim, release]
        default: shim
      scenario:
        description: Independently runnable live scenario (ignored by legacy suite)
        type: choice
        options: [both, admission, hpa]
        default: both

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tiers:
    if: github.event_name != 'workflow_dispatch' || inputs.suite != 'live'
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Tier 01-02: Local CLI and JVM"
            tiers: --tier 1 --tier 2
            java: true
            cluster: false
            helm: false
          - name: "Tier 03: Shim to runc"
            tiers: --tier 3
            java: true
            cluster: false
            helm: false
          - name: "Tier 04-06, 13: Kubernetes control plane"
            tiers: --tier 4 --tier 5 --tier 6 --tier 13
            java: false
            cluster: true
            helm: true
          - name: "Tier 07: Spring PetClinic"
            tiers: --tier 7
            java: true
            cluster: true
            helm: true
          - name: "Tier 08: Node-side AppCDS"
            tiers: --tier 8
            java: true
            cluster: true
            helm: false
          - name: "Tier 09: Serving and cgroups"
            tiers: --tier 9
            java: true
            cluster: true
            helm: false
          - name: "Tier 10: Helm installation"
            tiers: --tier 10
            java: false
            cluster: true
            helm: true
            cert_manager: true
          - name: "Tier 11: Webhook resilience"
            tiers: --tier 11
            java: false
            cluster: true
            helm: false
          - name: "Tier 12: Runnable image"
            tiers: --tier 12
            java: true
            cluster: true
            helm: false
          - name: "Tier 14: Custom JDK NodeProfile"
            tiers: --tier 14
            java: true
            cluster: true
            helm: false
          - name: "Tier 15: Runtime metrics"
            tiers: --tier 15
            java: true
            cluster: true
            helm: true
            network_policy: true
          - name: "Tier 16: Failure modes"
            tiers: --tier 16
            java: true
            cluster: true
            helm: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            kubernetes/go.sum

      - name: Set up JDK
        if: matrix.java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Test NodeProfile fixture safeguards
        if: contains(matrix.tiers, '--tier 4') || contains(matrix.tiers, '--tier 13')
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s integration-tests/e2e -p 'nodeprofile_fixtures_test.py' -v

      - name: Set up Helm
        if: matrix.helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Create kind cluster
        if: matrix.cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: brewlet-e2e
          config: ${{ matrix.network_policy && 'integration-tests/e2e/kind-network-policy.yaml' || '' }}

      - name: Install NetworkPolicy-capable CNI
        if: matrix.network_policy
        run: |
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.32.2/manifests/calico.yaml
          kubectl rollout status daemonset/calico-node -n kube-system --timeout=180s
          kubectl wait --for=condition=Ready nodes --all --timeout=180s

      - name: Install cert-manager
        if: matrix.cert_manager
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.21.1/cert-manager.yaml
          kubectl rollout status deployment/cert-manager -n cert-manager --timeout=180s
          kubectl rollout status deployment/cert-manager-cainjector -n cert-manager --timeout=180s
          kubectl rollout status deployment/cert-manager-webhook -n cert-manager --timeout=180s

      - name: Run tiers
        run: integration-tests/e2e/run.sh ${{ matrix.tiers }}

  # SPECIFICATION §4.4 publishes a multi-arch index (amd64 + arm64) and the shim
  # selects a platform manifest with containerd's STRICT matcher — no unmatched
  # fallback. Every job above runs on amd64, so arm64 was asserted only by unit
  # tests over the index writer and never actually executed. This job runs the
  # host-only tiers on a real arm64 runner: the CLI/JVM path (1-2) and the
  # shim-to-runc sandbox assembly (3), which is where an arch-specific
  # regression would surface.
  arm64:
    if: github.event_name != 'workflow_dispatch' || inputs.suite != 'live'
    name: "Tier 01-03 on arm64"
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            kubernetes/go.sum

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Confirm the runner really is arm64
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          echo "runner arch: $arch"
          [ "$arch" = "aarch64" ] || [ "$arch" = "arm64" ] || {
            echo "expected an arm64 runner, got $arch" >&2
            exit 1
          }
          [ "$(go env GOARCH)" = "arm64" ] || {
            echo "go toolchain is not arm64: $(go env GOARCH)" >&2
            exit 1
          }

      - name: Run host-only tiers
        run: integration-tests/e2e/run.sh --tier 1 --tier 2 --tier 3

  live:
    name: "Live ${{ matrix.scenario }} (two fresh clusters)"
    if: github.event_name != 'workflow_dispatch' || inputs.suite != 'legacy'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.scenario == 'hpa' && '["hpa"]' || inputs.scenario == 'admission' && '["admission"]' || '["admission","hpa"]') }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      BREWLET_LIVE_OUTPUT: ${{ runner.temp }}/brewlet-live-evidence
      BREWLET_LIVE_CANDIDATE: ${{ inputs.candidate || 'shim' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: admission/ratify-verifier/go.mod
          cache-dependency-path: admission/ratify-verifier/go.sum
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Install pinned kind
        run: |
          go install sigs.k8s.io/kind@v0.30.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          if ! command -v htpasswd; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq apache2-utils
          fi
      - name: Test strict fixture safeguards
        run: python3 -m unittest discover -s integration-tests/e2e/live -p '*test*.py' -v
      - name: Run two consecutive fresh-cluster scenarios
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          python3 "integration-tests/e2e/live/${SCENARIO}.py"
          python3 "integration-tests/e2e/live/${SCENARIO}.py"
      - name: Retain redacted evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-${{ matrix.scenario }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/brewlet-live-evidence
          if-no-files-found: error
          retention-days: 14
