name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tiers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Tier 01-02: Local CLI and JVM"
            tiers: --tier 1 --tier 2
            java: true
            cluster: false
            helm: false
          - name: "Tier 03: Shim to runc"
            tiers: --tier 3
            java: true
            cluster: false
            helm: false
          - name: "Tier 04-06, 13: Kubernetes control plane"
            tiers: --tier 4 --tier 5 --tier 6 --tier 13
            java: false
            cluster: true
            helm: true
          - name: "Tier 07: Spring PetClinic"
            tiers: --tier 7
            java: true
            cluster: true
            helm: true
          - name: "Tier 08: Node-side AppCDS"
            tiers: --tier 8
            java: true
            cluster: true
            helm: false
          - name: "Tier 09: Serving and cgroups"
            tiers: --tier 9
            java: true
            cluster: true
            helm: false
          - name: "Tier 10: Helm installation"
            tiers: --tier 10
            java: false
            cluster: true
            helm: true
          - name: "Tier 11: Webhook resilience"
            tiers: --tier 11
            java: false
            cluster: true
            helm: false
          - name: "Tier 12: Runnable image"
            tiers: --tier 12
            java: true
            cluster: true
            helm: false
          - name: "Tier 14: Custom JDK NodeProfile"
            tiers: --tier 14
            java: true
            cluster: true
            helm: false
          - name: "Tier 15: Runtime metrics"
            tiers: --tier 15
            java: true
            cluster: true
            helm: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            kubernetes/go.sum

      - name: Set up JDK
        if: matrix.java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Helm
        if: matrix.helm
        uses: azure/setup-helm@v5

      - name: Create kind cluster
        if: matrix.cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: brewlet-e2e

      - name: Run tiers
        run: integration-tests/e2e/run.sh ${{ matrix.tiers }}
