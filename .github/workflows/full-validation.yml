name: Brewlet full validation

# Every check, CodeQL language and native E2E on both architectures.
# Runs weekly on main, on manual dispatch, and is called by the release workflow
# for the exact tagged commit before anything is published.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      expected_sha:
        type: string
        required: true

permissions:
  contents: read

jobs:
  context:
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.guard.outputs.source }}
    steps:
      - name: Validate immutable source
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ github.sha }}
          EXPECTED: ${{ inputs.expected_sha }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          test "$REPOSITORY" = microsoft/brewlet
          [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]]
          case "$EVENT" in
            schedule)
              test -z "$EXPECTED"
              test "$REF" = refs/heads/main
              ;;
            workflow_dispatch)
              # Validates the head of the dispatched branch.
              test -z "$EXPECTED"
              case "$REF" in refs/heads/*) ;; *) exit 1 ;; esac
              ;;
            push)
              # Only the release workflow calls full validation from a push: a version tag.
              [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]
              test "$SOURCE" = "$EXPECTED"
              case "$REF" in refs/tags/v*) ;; *) exit 1 ;; esac
              ;;
            *) exit 1 ;;
          esac
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    needs: context
    uses: ./.github/workflows/checks.yml
    with:
      source: ${{ needs.context.outputs.source }}
      architectures: '["amd64","arm64"]'

  e2e:
    name: Real E2E
    needs: context
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    uses: ./.github/workflows/e2e.yml
    with:
      expected_sha: ${{ needs.context.outputs.source }}
      scenario: pr
      architecture: ${{ matrix.architecture }}
      languages: all

  codeql:
    name: CodeQL
    needs: context
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  validation:
    name: Brewlet full validation
    if: always()
    needs: [context, checks, e2e, codeql]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every prerequisite to succeed, never skipped or cancelled
        env:
          CONTEXT: ${{ needs.context.result }}
          CHECKS: ${{ needs.checks.result }}
          E2E: ${{ needs.e2e.result }}
          CODEQL: ${{ needs.codeql.result }}
        run: |
          test "$CONTEXT" = success
          test "$CHECKS" = success
          test "$E2E" = success
          test "$CODEQL" = success
