name: Publish Maven Central

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
      publish:
        description: Publish automatically after validation
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate or publish (for example v0.5.1)
        required: true
        type: string
      publish:
        description: Publish automatically after validation (irreversible)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: maven-central-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ inputs.publish && 'Publish' || 'Validate' }} signed Maven plugin
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: maven-central
    steps:
      - name: Validate release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] \
            || [[ "$RELEASE_TAG" == *-SNAPSHOT ]]; then
            echo "Expected a non-SNAPSHOT release tag such as v0.1.1" >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out publishing configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: publishing
          persist-credentials: false

      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: release
          persist-credentials: false

      - name: Verify specification version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          bash publishing/scripts/check-release-version.sh \
            "$RELEASE_VERSION" release/specs/SPECIFICATION.md

      - name: Apply publishing configuration to tagged POM
        run: |
          python3 publishing/maven-plugin/scripts/prepare_central_pom.py \
            publishing/maven-plugin/pom.xml release/maven-plugin/pom.xml

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: release/maven-plugin/pom.xml
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_PASSWORD

      - name: Set version and verify plugin
        working-directory: release/maven-plugin
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mvn -B --no-transfer-progress \
            org.codehaus.mojo:versions-maven-plugin:2.22.0:set \
            -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false
          mvn -B --no-transfer-progress clean verify
          scripts/generate-notice.sh --check

      - name: Sign and submit to Maven Central
        working-directory: release/maven-plugin
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          CENTRAL_AUTO_PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
          CENTRAL_WAIT_UNTIL: ${{ inputs.publish && 'published' || 'validated' }}
        run: |
          : "${MAVEN_CENTRAL_USERNAME:?Set the MAVEN_CENTRAL_USERNAME environment secret}"
          : "${MAVEN_CENTRAL_PASSWORD:?Set the MAVEN_CENTRAL_PASSWORD environment secret}"
          : "${MAVEN_GPG_KEY:?Set the MAVEN_GPG_KEY environment secret}"
          : "${MAVEN_GPG_PASSPHRASE:?Set the MAVEN_GPG_PASSPHRASE environment secret}"
          mvn -B --no-transfer-progress -Pcentral-release -DskipTests \
            -Dcentral.autoPublish="$CENTRAL_AUTO_PUBLISH" \
            -Dcentral.waitUntil="$CENTRAL_WAIT_UNTIL" deploy
