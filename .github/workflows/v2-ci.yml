name: Brewlet CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact immutable commit to validate
        type: string
        required: true
      purpose:
        description: Routine validation or historical evidence archival
        type: choice
        default: validation
        options: [validation, archive-history]
  workflow_call:
    inputs:
      expected_sha:
        type: string
        required: true

permissions:
  contents: read

jobs:
  context:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source: ${{ steps.guard.outputs.source }}
      purpose: ${{ steps.guard.outputs.purpose }}
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      - name: Validate immutable source and CI purpose
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED: ${{ inputs.expected_sha }}
          PURPOSE: ${{ inputs.purpose || 'validation' }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          test "$REPOSITORY" = microsoft/brewlet
          [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]]
          case "$PURPOSE" in validation|archive-history) ;; *) exit 1 ;; esac
          if test -n "$EXPECTED"; then
            [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]
            test "$SOURCE" = "$EXPECTED"
          fi
          case "$EVENT" in
            pull_request|push) test "$PURPOSE" = validation ;;
            workflow_dispatch)
              [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]
              test "$SOURCE" = "$EXPECTED"
              case "$REF" in refs/heads/*) ;; *) exit 1 ;; esac
              ;;
            *) exit 1 ;;
          esac
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "purpose=$PURPOSE" >> "$GITHUB_OUTPUT"
      - name: List exact pull request changes for E2E scope
        id: changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL: ${{ github.event.pull_request.number }}
          SOURCE: ${{ github.event.pull_request.head.sha }}
        run: |
          files="$RUNNER_TEMP/pull-request-files"
          listed=false
          if meta="$(gh api "repos/$REPOSITORY/pulls/$PULL" --jq '"\(.head.sha) \(.changed_files)"')" &&
              read -r head count <<< "$meta" && test "$head" = "$SOURCE" && test "$count" -lt 3000 &&
              gh api --paginate "repos/$REPOSITORY/pulls/$PULL/files?per_page=100" \
                --jq '.[] | .filename, (.previous_filename // empty)' > "$files"; then
            listed=true
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "listed=$listed" >> "$GITHUB_OUTPUT"
      - name: Classify E2E scope, failing closed to required
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          LISTED: ${{ steps.changes.outputs.listed }}
          FILES: ${{ steps.changes.outputs.files }}
        run: |
          required=true
          if test "$EVENT" = pull_request && test "$LISTED" = true && test -s "$FILES"; then
            required=false
            while IFS= read -r file; do
              case "$file" in
                .github/workflows/e2e.yml|.github/workflows/v2-ci.yml) required=true ;;
                docs/*|site/*|release-notes/*|*.md|.github/*) ;;
                *) required=true ;;
              esac
            done < "$FILES"
          fi
          echo "e2e=$required" >> "$GITHUB_OUTPUT"

  contracts:
    needs: context
    if: needs.context.outputs.purpose == 'validation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.context.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Execute Go and Maven contracts once and retain public receipts
        run: |
          python3 acceptance/run_check.py go-contracts
          python3 acceptance/run_check.py maven
      - name: Offline safeguard and ledger structure checks
        run: make test-python
      - name: Linux binaries on both declared architectures
        run: |
          GOOS=linux GOARCH=amd64 go build ./...
          GOOS=linux GOARCH=arm64 go build ./...
      - name: Current redistribution notices and packaging
        run: make legal-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: checks-contracts-${{ needs.context.outputs.source }}
          path: acceptance-export/*.json
          if-no-files-found: error
          retention-days: 14

  validation:
    name: ${{ inputs.purpose == 'archive-history' && 'Archive-only status' || 'Brewlet validation' }}
    if: always() && (needs.context.outputs.purpose == 'validation' || needs.context.result != 'success')
    needs: [context, contracts, producer-integration, linux-overlay-contract, archive-history, e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every prerequisite to succeed, never skipped or cancelled
        env:
          E2E_REQUIRED: ${{ needs.context.outputs.e2e }}
          CONTEXT: ${{ needs.context.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          PRODUCER: ${{ needs.producer-integration.result }}
          OVERLAY: ${{ needs.linux-overlay-contract.result }}
          HISTORY: ${{ needs.archive-history.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          test "$CONTEXT" = success
          test "$CONTRACTS" = success
          test "$PRODUCER" = success
          test "$OVERLAY" = success
          test "$HISTORY" = success
          if test "$E2E_REQUIRED" = true; then
            test "$E2E" = success
          else
            test "$E2E_REQUIRED" = false
            test "$E2E" = skipped
          fi

  e2e:
    name: Real E2E
    needs: context
    if: needs.context.outputs.purpose == 'validation' && needs.context.outputs.e2e == 'true'
    uses: ./.github/workflows/e2e.yml
    with:
      expected_sha: ${{ needs.context.outputs.source }}
      scenario: pr
      architecture: amd64
      # Pull requests exercise only the fastest fixture; main pushes (release gate) keep all four.
      languages: ${{ github.event_name == 'pull_request' && 'python' || 'all' }}

  producer-integration:
    needs: context
    if: needs.context.outputs.purpose == 'validation'
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.context.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.22.0"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: integration-tests/fixtures/dotnet/global.json
      - name: Build producer
        run: make build
      - name: Four language fixtures and optional Maven producer
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 acceptance/run_check.py fixtures
      - name: Real registry publication (not node acceptance)
        run: python3 acceptance/run_check.py registry
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: checks-producer-${{ matrix.architecture }}-${{ needs.context.outputs.source }}
          path: acceptance-export/*.json
          if-no-files-found: error
          retention-days: 14

  linux-overlay-contract:
    needs: context
    if: needs.context.outputs.purpose == 'validation'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            architecture: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.context.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Exercise real overlay metadata, not a scheduling test
        run: |
          python3 acceptance/run_check.py native-contracts
          python3 acceptance/run_check.py go-vet
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: checks-kernel-${{ matrix.architecture }}-${{ needs.context.outputs.source }}
          path: acceptance-export/*.json
          if-no-files-found: error
          retention-days: 14

  archive-history:
    name: Historical evidence archive
    needs: context
    if: needs.context.outputs.purpose == 'validation' || needs.context.outputs.purpose == 'archive-history'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.context.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize byte-verified historical public JSON only
        id: history
        run: python3 acceptance/evidence_index.py export-history --if-needed --output "${{ runner.temp }}/acceptance-history"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.history.outputs.written == 'true'
        with:
          name: historical-acceptance-receipts-${{ needs.context.outputs.source }}
          path: ${{ runner.temp }}/acceptance-history/
          if-no-files-found: error
          retention-days: 90
