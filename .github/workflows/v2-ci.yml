name: Brewlet 2 contracts

on:
  push:
    branches: [brewlet-2.0]
  pull_request:
  workflow_dispatch:
    inputs:
      release_gate:
        description: Require every Proposal 0009 requirement to have successful evidence
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit and contract coverage (not real-node acceptance)
        run: make test
      - name: Linux binaries on both declared architectures
        run: |
          GOOS=linux GOARCH=amd64 go build ./...
          GOOS=linux GOARCH=arm64 go build ./...
      - name: Strict release gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_gate }}
        run: make acceptance

  producer-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.22.0"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: integration-tests/fixtures/dotnet/global.json
      - name: Build producer
        run: make build
      - name: Four language fixtures and optional Maven producer
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 integration-tests/fixtures/check.py --brewlet ./bin/brewlet --work-parent "${{ runner.temp }}"
      - name: Real registry publication (not node acceptance)
        run: python3 integration-tests/registry.py --brewlet ./bin/brewlet --work-parent "${{ runner.temp }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: producer-integration-results
          path: |
            ${{ runner.temp }}/brewlet-v2-fixtures-*/result.json
            ${{ runner.temp }}/brewlet-v2-registry-*/result.json
          if-no-files-found: warn
          retention-days: 7

  linux-overlay-contract:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Compile Linux materialization contract
        run: |
          go test -c -o bin/artifact.test ./pkg/artifact
          go test -c -o bin/shim.test ./shim/cmd/containerd-shim-brewlet-v2
          go test -c -o bin/provisioner.test ./provisioner
          go test -c -o bin/node.test ./pkg/node
      - name: Build isolated pinned test userland
        run: >-
          docker build --load --platform "${{ matrix.platform }}"
          --file integration-tests/fixtures/runtimes/python.Dockerfile
          --tag brewlet-overlay-contract:${{ github.run_id }}
          integration-tests/fixtures/runtimes
      - name: Exercise real overlay metadata, not a scheduling test
        run: |
          set -euo pipefail
          docker run --rm --platform "${{ matrix.platform }}" --network none \
            --user 0:0 --cap-drop ALL --cap-add SYS_ADMIN --cap-add MKNOD \
            --security-opt no-new-privileges --read-only --tmpfs /tmp \
            --tmpfs /src/pkg/artifact:rw,mode=755 \
            --mount "type=bind,source=$PWD,target=/src,readonly" \
            --mount "type=bind,source=$PWD/bin,target=/tests,readonly" \
            --workdir /src/pkg/artifact --entrypoint /tests/artifact.test \
            brewlet-overlay-contract:${{ github.run_id }} \
            -test.v -test.run TestLinuxOverlayWhiteoutMaterialization | tee overlay.log
          ! grep -q '^--- SKIP' overlay.log
          docker run --rm --platform "${{ matrix.platform }}" --network none \
            --user 0:0 --cap-drop ALL --cap-add SYS_ADMIN --cap-add MKNOD \
            --security-opt no-new-privileges --read-only --tmpfs /tmp \
            --tmpfs /src/shim/cmd/containerd-shim-brewlet-v2:rw,mode=755 \
            --mount "type=bind,source=$PWD,target=/src,readonly" \
            --mount "type=bind,source=$PWD/bin,target=/tests,readonly" \
            --workdir /src/shim/cmd/containerd-shim-brewlet-v2 --entrypoint /tests/shim.test \
            brewlet-overlay-contract:${{ github.run_id }} \
            -test.v -test.run 'TestPublishedProducerShimConformance|TestWarm|TestFailedCreateMountProvenance' | tee shim-conformance.log
          ! grep -q '^--- SKIP' shim-conformance.log
          docker run --rm --platform "${{ matrix.platform }}" --network none \
            --user 0:0 --cap-drop ALL --cap-add SYS_ADMIN --cap-add MKNOD \
            --security-opt no-new-privileges --read-only --tmpfs /tmp --tmpfs /work \
            --mount "type=bind,source=$PWD/bin,target=/tests,readonly" \
            --workdir /work --entrypoint /tests/node.test \
            brewlet-overlay-contract:${{ github.run_id }} \
            -test.v -test.run 'TestLinuxEvidence|TestTaskMountScope|TestPendingCreateLeaseScope' | tee lease-evidence.log
          ! grep -q '^--- SKIP' lease-evidence.log
          docker run --rm --platform "${{ matrix.platform }}" --network none \
            --user 0:0 --cap-drop ALL --cap-add SYS_ADMIN --cap-add MKNOD \
            --security-opt no-new-privileges --read-only --tmpfs /tmp --tmpfs /work \
            --mount "type=bind,source=$PWD/bin,target=/tests,readonly" \
            --workdir /work --entrypoint /tests/provisioner.test \
            brewlet-overlay-contract:${{ github.run_id }} \
            -test.v -test.run 'TestCacheCollection|TestOriginalContentCollection|Test.*(Activation|Retention|ContainerdVersions|LiveCRI|EffectiveBaseline)|TestPublicationRejectsContradictoryInstallationEvidence|TestRecovery(Quarantine|AllIDs)' | tee cache-gc.log
          ! grep -q '^--- SKIP' cache-gc.log
