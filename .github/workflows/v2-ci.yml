name: Brewlet CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact immutable commit to validate
        type: string
        required: true
      purpose:
        description: Routine validation or historical evidence archival
        type: choice
        default: validation
        options: [validation, archive-history]
  workflow_call:
    inputs:
      expected_sha:
        type: string
        required: true

permissions:
  contents: read

jobs:
  context:
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.guard.outputs.source }}
      purpose: ${{ steps.guard.outputs.purpose }}
      documentation_required: ${{ steps.guard.outputs.documentation_required }}
    steps:
      - name: Validate immutable source and CI purpose
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED: ${{ inputs.expected_sha }}
          PURPOSE: ${{ inputs.purpose || 'validation' }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          test "$REPOSITORY" = microsoft/brewlet
          [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]]
          case "$PURPOSE" in validation|archive-history) ;; *) exit 1 ;; esac
          if test -n "$EXPECTED"; then
            [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]
            test "$SOURCE" = "$EXPECTED"
          fi
          case "$EVENT" in
            pull_request|push) test "$PURPOSE" = validation ;;
            workflow_dispatch)
              [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]
              test "$SOURCE" = "$EXPECTED"
              case "$REF" in refs/heads/*) ;; *) exit 1 ;; esac
              ;;
            *) exit 1 ;;
          esac
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "purpose=$PURPOSE" >> "$GITHUB_OUTPUT"
          # Temporary documentation-CI exception requested for PR #306 only.
          if test "$EVENT" = pull_request && test "$PR_NUMBER" = 306; then
            echo "documentation_required=false" >> "$GITHUB_OUTPUT"
          else
            echo "documentation_required=true" >> "$GITHUB_OUTPUT"
          fi

  contracts:
    needs: context
    if: needs.context.outputs.purpose == 'validation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.context.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Execute Go and Maven contracts once and retain public receipts
        run: |
          python3 acceptance/run_check.py go-contracts
          python3 acceptance/run_check.py maven
      - name: Offline safeguard and ledger structure checks
        run: make test-python
      - name: Linux binaries on both declared architectures
        run: |
          GOOS=linux GOARCH=amd64 go build ./...
          GOOS=linux GOARCH=arm64 go build ./...
      - name: Current redistribution notices and packaging
        run: make legal-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checks-contracts-${{ needs.context.outputs.source }}
          path: acceptance-export/*.json
          if-no-files-found: error
          retention-days: 14

  validation:
    name: ${{ inputs.purpose == 'archive-history' && 'Archive-only status' || 'Brewlet validation' }}
    if: always() && (needs.context.outputs.purpose == 'validation' || needs.context.result != 'success')
    needs: [context, contracts, producer-integration, linux-overlay-contract, documentation, archive-history, e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every prerequisite unless documentation is explicitly disabled
        env:
          CONTEXT: ${{ needs.context.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          PRODUCER: ${{ needs.producer-integration.result }}
          OVERLAY: ${{ needs.linux-overlay-contract.result }}
          DOCUMENTATION: ${{ needs.documentation.result }}
          DOCUMENTATION_REQUIRED: ${{ needs.context.outputs.documentation_required }}
          HISTORY: ${{ needs.archive-history.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          test "$CONTEXT" = success
          test "$CONTRACTS" = success
          test "$PRODUCER" = success
          test "$OVERLAY" = success
          case "$DOCUMENTATION_REQUIRED:$DOCUMENTATION" in
            true:success|false:skipped) ;;
            *) exit 1 ;;
          esac
          test "$HISTORY" = success
          test "$E2E" = success

  e2e:
    name: Real four-language E2E
    needs: [context, contracts, producer-integration, linux-overlay-contract, documentation, archive-history]
    if: >-
      always() &&
      needs.context.outputs.purpose == 'validation' &&
      needs.context.result == 'success' &&
      needs.contracts.result == 'success' &&
      needs.producer-integration.result == 'success' &&
      needs.linux-overlay-contract.result == 'success' &&
      ((needs.context.outputs.documentation_required == 'true' && needs.documentation.result == 'success') ||
       (needs.context.outputs.documentation_required == 'false' && needs.documentation.result == 'skipped')) &&
      needs.archive-history.result == 'success'
    uses: ./.github/workflows/e2e.yml
    with:
      expected_sha: ${{ needs.context.outputs.source }}
      scenario: pr
      architecture: amd64

  producer-integration:
    needs: context
    if: needs.context.outputs.purpose == 'validation'
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.context.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.22.0"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: integration-tests/fixtures/dotnet/global.json
      - name: Build producer
        run: make build
      - name: Four language fixtures and optional Maven producer
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 acceptance/run_check.py fixtures
      - name: Real registry publication (not node acceptance)
        run: python3 acceptance/run_check.py registry
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checks-producer-${{ matrix.architecture }}-${{ needs.context.outputs.source }}
          path: acceptance-export/*.json
          if-no-files-found: error
          retention-days: 14

  linux-overlay-contract:
    needs: context
    if: needs.context.outputs.purpose == 'validation'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            architecture: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.context.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Exercise real overlay metadata, not a scheduling test
        run: |
          python3 acceptance/run_check.py native-contracts
          python3 acceptance/run_check.py go-vet
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checks-kernel-${{ matrix.architecture }}-${{ needs.context.outputs.source }}
          path: acceptance-export/*.json
          if-no-files-found: error
          retention-days: 14

  documentation:
    needs: context
    if: needs.context.outputs.purpose == 'validation' && needs.context.outputs.documentation_required == 'true'
    uses: ./.github/workflows/site-pages.yml
    with:
      expected_sha: ${{ needs.context.outputs.source }}

  archive-history:
    name: Historical evidence archive
    needs: context
    if: needs.context.outputs.purpose == 'validation' || needs.context.outputs.purpose == 'archive-history'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.context.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize byte-verified historical public JSON only
        id: history
        run: python3 acceptance/evidence_index.py export-history --if-needed --output "${{ runner.temp }}/acceptance-history"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.history.outputs.written == 'true'
        with:
          name: historical-acceptance-receipts-${{ needs.context.outputs.source }}
          path: ${{ runner.temp }}/acceptance-history/
          if-no-files-found: error
          retention-days: 90
