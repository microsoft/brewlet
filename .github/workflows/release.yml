name: Brewlet release

# Pushing tag vX.Y.Z (matching release.json) builds, verifies and publishes the release.
# Versions below 1.0.0 and -alpha/-beta/-rc versions are published as GitHub prereleases
# and are never marked latest. A manual dispatch is a build-only dry run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brewlet-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      channel: ${{ steps.identity.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require same-repository tag matching the release identity
        id: identity
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          test "$REPOSITORY" = microsoft/brewlet
          python3 scripts/release.py identity > /dev/null
          version="$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')"
          channel="$(python3 scripts/release.py channel)"
          case "$EVENT" in
            push) test "$REF" = "refs/tags/v$version" || { echo "tag $REF does not match release.json version $version" >&2; exit 1; } ;;
            workflow_dispatch) echo "Dry run: build and verify only; nothing is published." ;;
            *) exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Brewlet $version ($channel)" >> "$GITHUB_STEP_SUMMARY"

  ci-gate:
    needs: metadata
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install integrity-pinned GitHub CLI proxy
        run: |
          python3 scripts/release_tools.py --destination "$RUNNER_TEMP/release-tools" ghx
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
      - name: Require the tagged commit to have passed Brewlet CI on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 100); do
            runs="$(ghx api "repos/$REPOSITORY/actions/workflows/v2-ci.yml/runs?head_sha=$SOURCE&event=push&branch=main&per_page=20")"
            if [ "$(jq '[.workflow_runs[] | select(.conclusion == "success")] | length' <<<"$runs")" -gt 0 ]; then
              echo "Brewlet CI passed on main for $SOURCE"
              exit 0
            fi
            if [ "$(jq '[.workflow_runs[] | select(.status != "completed")] | length' <<<"$runs")" -eq 0 ]; then
              echo "no successful or pending Brewlet CI push run on main for $SOURCE; tag a green main commit" >&2
              exit 1
            fi
            echo "Brewlet CI still running for $SOURCE (attempt $attempt)"
            sleep 60
          done
          echo "timed out waiting for Brewlet CI on main for $SOURCE" >&2
          exit 1

  candidate:
    needs: metadata
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml

  publish:
    needs: [metadata, ci-gate, candidate]
    if: ${{ github.event_name == 'push' && needs.metadata.result == 'success' && needs.ci-gate.result == 'success' && needs.candidate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: maven-central
    permissions:
      contents: write
      packages: write
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.0"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v3.19.0
      - name: Install integrity-pinned publication tools
        run: |
          python3 scripts/release_tools.py --destination "$RUNNER_TEMP/release-tools" ghx oras
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-candidate-${{ github.sha }}
          path: dist/candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-cli-*
          merge-multiple: true
          path: dist/candidate/evidence
      - name: Verify artifacts, attestations, tag and owner policy before using credentials
        run: python3 scripts/publish_release.py preflight
      - name: Sign exact existing Maven payloads in an ephemeral keyring
        env:
          GNUPGHOME: ${{ runner.temp }}/brewlet-release-gnupg
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          mkdir -m 700 "$GNUPGHOME"
          python3 scripts/publish_release.py sign-maven
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Transfer already qualified images and chart without rebuilding
        id: images
        run: python3 scripts/publish_release.py images
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ghcr.io/microsoft/brewlet-operator
          subject-digest: ${{ steps.images.outputs.operator_digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ghcr.io/microsoft/brewlet-admission
          subject-digest: ${{ steps.images.outputs.admission_digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ghcr.io/microsoft/brewlet-node-provisioner
          subject-digest: ${{ steps.images.outputs.node_digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ghcr.io/microsoft/charts/brewlet
          subject-digest: ${{ steps.images.outputs.chart_digest }}
          push-to-registry: true
      - name: Attest publication coordinates and exact signed bundle
        id: publication
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/candidate/published.json
            dist/candidate/signatures/*.asc
            dist/candidate/central-bundle.zip
      - name: Preserve publication verification bundle
        env:
          BUNDLE: ${{ steps.publication.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/candidate/attestations/publication.jsonl
      - name: Submit exact signed bundle to Maven Central without rebuilding
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: python3 scripts/publish_release.py central
      - name: Publish GitHub release (prerelease below 1.0.0 or with a suffix)
        run: python3 scripts/publish_release.py release
      - name: Independently fetch and verify published distributions
        env:
          GNUPGHOME: ${{ runner.temp }}/brewlet-release-gnupg
          SOURCE: ${{ github.sha }}
        run: python3 scripts/verify_release.py --source "$SOURCE"
      - name: Remove only the ephemeral signing keyring
        if: always()
        env:
          GNUPGHOME: ${{ runner.temp }}/brewlet-release-gnupg
        run: |
          gpgconf --kill gpg-agent || true
          python3 -c 'import os,shutil; from pathlib import Path; p=Path(os.environ["GNUPGHOME"]); shutil.rmtree(p) if p.is_dir() else None'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: publication-reconciliation
          path: |
            dist/candidate/published.json
            dist/candidate/central-deployment.json
            dist/candidate/attestations/
          if-no-files-found: warn
          retention-days: 30
