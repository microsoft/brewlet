name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string

# Write scopes are granted per job. Build-only jobs must never carry the
# ability to publish releases or packages.
permissions:
  contents: read

jobs:
  container-security:
    name: Container build integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Enforce Dockerfile security policy
        run: make container-security-check

      - name: Enforce workflow supply-chain policy
        run: make workflow-security-check

      - name: Test downloaded asset integrity
        run: ./provisioner/dockerfile_test.sh

  images:
    name: Image - ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: container-security
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - name: operator
            component: operator
            image: brewlet-operator
            context: .
            file: kubernetes/Dockerfile
            build_args: CMD=manager
          - name: admission
            component: admission
            image: brewlet-admission
            context: .
            file: kubernetes/Dockerfile
            build_args: CMD=admission
          - name: node-provisioner
            component: provisioner
            image: brewlet-node-provisioner
            context: .
            file: provisioner/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: version
        name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/microsoft/${{ matrix.image }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/microsoft/brewlet
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Pushed to the registry as an OCI referrer so consumers can verify an
      # image without trusting this repository's release page.
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/microsoft/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record image digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "build did not report a usable image digest: $DIGEST" >&2
            exit 1
          fi
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/${{ matrix.component }}.digest"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.component }}
          path: digests/${{ matrix.component }}.digest
          if-no-files-found: error

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    needs: images
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: version
        name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: digests

      # A published chart must resolve images by digest, not by a tag that can
      # later be repointed at a different image.
      - name: Record image digests in the chart
        shell: bash
        run: |
          command -v yq >/dev/null || {
            echo "yq is required to record chart image digests" >&2
            exit 1
          }
          for component in operator provisioner admission; do
            digest="$(cat "digests/${component}.digest")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "missing or malformed digest for $component: $digest" >&2
              exit 1
            fi
            digest="$digest" component="$component" yq -i \
              '.images.digests[strenv(component)] = strenv(digest)' \
              kubernetes/charts/brewlet/values.yaml
          done
          yq '.images.digests' kubernetes/charts/brewlet/values.yaml

      - name: Package chart
        run: |
          # The chart fails closed without provisioner.pools, so name one:
          # this step checks packaging, not the placement guard (which
          # kubernetes/Makefile helm-scheduling-check covers).
          helm lint kubernetes/charts/brewlet --set provisioner.pools="{general}"
          helm package kubernetes/charts/brewlet \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination dist

      - name: Verify packaged chart is digest-pinned
        shell: bash
        run: |
          helm template brewlet "dist/brewlet-${{ steps.version.outputs.version }}.tgz" \
            --set provisioner.pools="{general}" \
            > rendered.yaml
          for image in brewlet-operator brewlet-admission brewlet-node-provisioner; do
            grep -Eq "ghcr\.io/microsoft/${image}@sha256:[0-9a-f]{64}" rendered.yaml || {
              echo "packaged chart does not pin $image to a digest" >&2
              exit 1
            }
          done

      - id: push
        name: Publish chart
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
          # helm reports the pushed digest on stderr.
          helm push "dist/brewlet-${{ steps.version.outputs.version }}.tgz" \
            oci://ghcr.io/microsoft/charts 2>&1 | tee push.log
          digest="$(awk '/^Digest:/ { print $2 }' push.log | tail -n 1)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "helm push did not report a usable chart digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest chart provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/microsoft/charts/brewlet
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  cli:
    name: CLI - ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: version
        name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod

      - name: Build archive
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go -C core build \
            -trimpath \
            -ldflags="-s -w -X main.version=$VERSION" \
            -o ../dist/brewlet \
            ./cmd/brewlet
          GOOS="$GOOS" GOARCH="$GOARCH" \
            ./scripts/generate-go-notice.sh core dist/NOTICE.txt ./cmd/brewlet
          cp LICENSE.txt dist/LICENSE.txt
          tar -C dist -czf "brewlet_${VERSION}_${GOOS}_${GOARCH}.tar.gz" \
            brewlet LICENSE.txt NOTICE.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brewlet-${{ matrix.os }}-${{ matrix.arch }}
          path: brewlet_*.tar.gz
          if-no-files-found: error

  maven-plugin:
    name: Maven plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: version
        name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: maven-plugin/pom.xml

      - name: Build release artifact
        working-directory: maven-plugin
        run: |
          mvn -B --no-transfer-progress \
            versions:set \
            -DnewVersion="${{ steps.version.outputs.version }}" \
            -DgenerateBackupPoms=false
          mvn -B --no-transfer-progress verify
          scripts/generate-notice.sh --check
          unzip -l "target/brewlet-maven-plugin-${{ steps.version.outputs.version }}.jar" \
            | grep -q 'META-INF/NOTICE.txt'
          unzip -l "target/brewlet-maven-plugin-${{ steps.version.outputs.version }}.jar" \
            | grep -q 'META-INF/LICENSE.txt'
          mkdir -p ../dist
          cp "target/brewlet-maven-plugin-${{ steps.version.outputs.version }}.jar" ../dist/
          cp pom.xml "../dist/brewlet-maven-plugin-${{ steps.version.outputs.version }}.pom"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brewlet-maven-plugin
          path: dist/brewlet-maven-plugin-*
          if-no-files-found: error

  github-release:
    name: GitHub release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [images, chart, cli, maven-plugin]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: brewlet-*
          merge-multiple: true
          path: dist

      # Every published pattern must match, so a missing component fails the
      # release instead of shipping an incomplete checksum manifest.
      - name: Create checksums
        working-directory: dist
        shell: bash
        run: |
          files=()
          for pattern in 'brewlet_*.tar.gz' 'brewlet-maven-plugin-*.jar' \
            'brewlet-maven-plugin-*.pom'; do
            mapfile -t matches < <(compgen -G "$pattern" || true)
            if ((${#matches[@]} == 0)); then
              echo "no release artifact matched $pattern" >&2
              exit 1
            fi
            files+=("${matches[@]}")
          done
          printf '%s\n' "${files[@]}" | sort | xargs sha256sum > checksums.txt
          cat checksums.txt

      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/brewlet_*.tar.gz
            dist/brewlet-maven-plugin-*.jar
            dist/brewlet-maven-plugin-*.pom

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/brewlet_*.tar.gz
            dist/brewlet-maven-plugin-*.jar
            dist/brewlet-maven-plugin-*.pom
            dist/checksums.txt

  provenance-smoke:
    name: Release provenance
    # verify-release-provenance.sh resolves images, the chart, and release
    # assets anonymously, which a private repository refuses, so the check can
    # only pass once brewlet is public. Gating on visibility rather than
    # deleting the job restores the check by itself at that point.
    if: >-
      github.ref_type == 'tag'
      && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    needs: github-release
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify published signatures and attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/verify-release-provenance.sh "${GITHUB_REF_NAME#v}"
