name: Brewlet promotion qualification

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  qualification:
    name: Brewlet promotion qualification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require complete evidence for the immutable candidate
        run: make acceptance
