name: CodeQL

# Reusable: the PR workflow analyzes only impacted languages; Release Gate Tests analyzes all of them.
on:
  workflow_call:
    inputs:
      languages:
        description: JSON list of CodeQL languages to analyze
        type: string
        default: '["actions","csharp","go","java-kotlin","javascript-typescript","python"]'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    env:
      # Go is compiled for analysis; every other language is extracted without a build.
      BUILD_MODE: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
    steps:
      - name: Require a supported language
        env:
          LANGUAGE: ${{ matrix.language }}
        run: case "$LANGUAGE" in actions|csharp|go|java-kotlin|javascript-typescript|python) ;; *) exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        if: matrix.language == 'csharp'
        with:
          global-json-file: integration-tests/fixtures/dotnet/global.json
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ env.BUILD_MODE }}
      - name: Autobuild Go
        if: env.BUILD_MODE == 'autobuild'
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: /language:${{ matrix.language }}
