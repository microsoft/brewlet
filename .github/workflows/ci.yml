name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.plan.outputs.core }}
      kubernetes: ${{ steps.plan.outputs.kubernetes }}
      admission: ${{ steps.plan.outputs.admission }}
      helm: ${{ steps.plan.outputs.helm }}
      containers: ${{ steps.plan.outputs.containers }}
      maven: ${{ steps.plan.outputs.maven }}
      notices: ${{ steps.plan.outputs.notices }}
      docs: ${{ steps.plan.outputs.docs }}
      host: ${{ steps.plan.outputs.host }}
      live: ${{ steps.plan.outputs.live }}
      image_integrity: ${{ steps.plan.outputs.image_integrity }}
      maven_release: ${{ steps.plan.outputs.maven_release }}
      host_matrix: ${{ steps.plan.outputs.host_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select checks from the complete PR diff
        id: plan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_plan.py plan

  core:
    name: Go core runtime
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Set up JDK for AppCDS integration
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l $(go list -f '{{.Dir}}' ./...))"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Build released CLI platforms
        working-directory: .
        run: make cli-platform-check

      - name: Test
        run: go test -race ./...

      - name: Test privileged provisioner source policy
        working-directory: .
        run: bash provisioner/entrypoint_test.sh

  kubernetes:
    name: Go Kubernetes platform
    needs: changes
    if: needs.changes.outputs.kubernetes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kubernetes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: kubernetes/go.mod
          cache-dependency-path: kubernetes/go.sum

      - name: Verify formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Set up envtest control plane
        run: |
          go install "sigs.k8s.io/controller-runtime/tools/setup-envtest@$(
            make --no-print-directory print-setup-envtest-version
          )"
          setup_envtest="$(go env GOPATH)/bin/setup-envtest"
          echo "KUBEBUILDER_ASSETS=$("$setup_envtest" use 1.31.0 -p path)" >> "$GITHUB_ENV"

      - name: Set up Helm for lifecycle and CLI integration tests
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Test
        env:
          BREWLET_REQUIRE_CLI_INTEGRATION: "true"
          BREWLET_REQUIRE_HELM: "true"
        run: make test

  admission:
    name: Ratify admission verifier
    needs: changes
    if: needs.changes.outputs.admission == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: admission/ratify-verifier/go.mod
          cache-dependency-path: admission/ratify-verifier/go.sum

      - name: Verify formatting
        working-directory: admission/ratify-verifier
        run: |
          unformatted="$(gofmt -l $(go list -f '{{.Dir}}' ./...))"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        working-directory: admission/ratify-verifier
        run: go build ./...

      # Delegates to the Makefile target so `make check-all` and CI stay identical.
      - name: Vet and test
        run: make admission-check

  helm:
    name: Helm chart
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: kubernetes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # Lifecycle Go tests run once, with race detection + envtest, in kubernetes.
      - name: Lint and render chart
        run: make helm-render-check

  safeguards:
    name: Repository safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify source license headers and Dockerfile policy
        run: make license-check container-security-check

      - name: Enforce workflow pinning and permission scoping
        run: make workflow-security-check

      - name: Test CI selection and merge gate
        run: make ci-contract-check

      - name: Test release specification version guard
        run: bash scripts/check-release-version_test.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Check site and installation contracts
        run: make site-contract-check

      - name: Test E2E suite routing and monitor history (offline)
        run: make e2e-contract-check

      - name: Test isolated live fixture safeguards (offline)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s integration-tests/e2e/live -p '*test*.py' -v

  containers:
    name: Container build integrity
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Test corrupt-download rejection
        if: needs.changes.outputs.image_integrity == 'true'
        run: ./provisioner/dockerfile_test.sh

      - name: Build provisioner once for native inspection
        run: |
          docker buildx build --platform linux/amd64 --load \
            -t brewlet-node-provisioner:ci -f provisioner/Dockerfile .
          docker run --rm --entrypoint /usr/bin/test brewlet-node-provisioner:ci \
            -x /opt/brewlet-dist/brewlet-source-policy

      - name: Build all shipped image variants on both architectures
        run: make container-image-test

  maven:
    name: Maven plugin (JDK 17)
    needs: changes
    if: needs.changes.outputs.maven == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: maven-plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17 baseline
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: maven-plugin/pom.xml

      - name: Build and test
        run: mvn -B --no-transfer-progress -Dmaven.compiler.release=17 verify

      - name: Verify packaged notices
        run: |
          scripts/generate-notice.sh --check
          unzip -l target/brewlet-maven-plugin-*.jar | grep -q 'META-INF/NOTICE.txt'
          unzip -l target/brewlet-maven-plugin-*.jar | grep -q 'META-INF/LICENSE.txt'

      - name: Validate Central release artifacts without credentials or upload
        if: needs.changes.outputs.maven_release == 'true'
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_*.py' -v
          mvn -B --no-transfer-progress \
            org.codehaus.mojo:versions-maven-plugin:2.22.0:set \
            -DnewVersion=0.0.0-SNAPSHOT -DgenerateBackupPoms=false
          if mvn -B --no-transfer-progress -Pcentral-release validate >target/snapshot-check.log 2>&1; then
            echo "The Central release profile must reject SNAPSHOT versions" >&2
            exit 1
          fi
          grep -q 'RequireReleaseVersion failed' target/snapshot-check.log || {
            cat target/snapshot-check.log >&2
            exit 1
          }
          mvn -B --no-transfer-progress \
            org.codehaus.mojo:versions-maven-plugin:2.22.0:set \
            -DnewVersion=0.0.0-ci -DgenerateBackupPoms=false
          mvn -B --no-transfer-progress -Pcentral-release \
            -DskipTests -Dgpg.skip=true verify
          for suffix in .jar -sources.jar -javadoc.jar; do
            test -s "target/brewlet-maven-plugin-0.0.0-ci${suffix}"
          done
          unzip -p target/brewlet-maven-plugin-0.0.0-ci.jar META-INF/maven/plugin.xml \
            | grep -F '<goalPrefix>brewlet</goalPrefix>' > /dev/null
          unzip -p target/brewlet-maven-plugin-0.0.0-ci-sources.jar \
            sh/brewlet/maven/plugin/PushMojo.java > /dev/null
          unzip -p target/brewlet-maven-plugin-0.0.0-ci-javadoc.jar \
            sh/brewlet/maven/plugin/PushMojo.html > /dev/null

  notices:
    name: Go notices
    needs: changes
    if: needs.changes.outputs.notices == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            kubernetes/go.sum

      - name: Verify Go notices
        run: |
          work="$(mktemp -d)"
          GOOS=linux GOARCH=amd64 ./scripts/generate-go-notice.sh \
            core "$work/cli.txt" ./cmd/brewlet
          GOOS=linux GOARCH=amd64 ./scripts/generate-go-notice.sh \
            core "$work/provisioner.txt" \
            ./shim/cmd/containerd-shim-brewlet-v2 \
            ./cmd/brewlet-metrics-exporter \
            ./cmd/brewlet-source-policy
          GOOS=linux GOARCH=amd64 ./scripts/generate-go-notice.sh \
            kubernetes "$work/operator.txt" ./cmd/manager
          GOOS=linux GOARCH=amd64 ./scripts/generate-go-notice.sh \
            kubernetes "$work/admission.txt" ./cmd/admission
          test -s "$work/cli.txt"
          test -s "$work/provisioner.txt"
          test -s "$work/operator.txt"
          test -s "$work/admission.txt"

  docs:
    name: Documentation and website notices
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/notices/package-lock.json

      - name: Verify website notice
        run: |
          python -m pip install --quiet -r site/requirements.txt
          npm ci --ignore-scripts --prefix site/notices
          python site/scripts/generate-notice.py
          git diff --exit-code -- site/NOTICE.txt

      - name: Build documentation with strict link validation
        run: python -m mkdocs build --strict -f site/mkdocs.yml

  host:
    name: Host smoke (tier ${{ matrix.tier }})
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tier: ${{ fromJSON(needs.changes.outputs.host_matrix) }}
    env:
      E2E_REQUIRE_ALL: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Select private work directory
        run: echo "E2E_WORK=$RUNNER_TEMP/brewlet-host-work" >> "$GITHUB_ENV"
      - name: Run required host tier
        env:
          TIER: ${{ matrix.tier }}
        run: |
          mkdir -p "$E2E_WORK"
          set -o pipefail
          integration-tests/e2e/run.sh --tier "$TIER" 2>&1 | tee "$E2E_WORK/runner.log"
      - name: Collect redacted diagnostics
        if: always()
        run: python3 integration-tests/e2e/collect_diagnostics.py "$E2E_WORK" "$RUNNER_TEMP/brewlet-host-evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: host-${{ matrix.tier }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/brewlet-host-evidence
          if-no-files-found: error
          retention-days: 7

  live:
    name: Publish/deploy handoff smoke (one fresh cluster)
    needs: changes
    if: needs.changes.outputs.live == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            kubernetes/go.sum
            admission/ratify-verifier/go.sum
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Install pinned kind
        run: |
          go install sigs.k8s.io/kind@v0.33.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Select isolated evidence directory
        run: echo "BREWLET_LIVE_OUTPUT=$RUNNER_TEMP/brewlet-live-evidence" >> "$GITHUB_ENV"
      - name: Run deployment smoke once
        run: python3 integration-tests/e2e/live/smoke.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pr-live-smoke-${{ github.run_attempt }}
          path: ${{ runner.temp }}/brewlet-live-evidence
          if-no-files-found: error
          retention-days: 7

  pr-checks:
    name: PR checks
    if: always()
    needs: [changes, safeguards, core, kubernetes, admission, helm, containers, maven, notices, docs, host, live]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every selected check to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_plan.py gate
