name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Go core runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l $(go list -f '{{.Dir}}' ./...))"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      - name: Test privileged provisioner source policy
        working-directory: .
        run: bash provisioner/entrypoint_test.sh

  kubernetes:
    name: Go Kubernetes platform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kubernetes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: kubernetes/go.mod
          cache-dependency-path: kubernetes/go.sum

      - name: Verify formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Set up envtest control plane
        run: |
          go install "sigs.k8s.io/controller-runtime/tools/setup-envtest@$(
            make --no-print-directory print-setup-envtest-version
          )"
          setup_envtest="$(go env GOPATH)/bin/setup-envtest"
          echo "KUBEBUILDER_ASSETS=$("$setup_envtest" use 1.31.0 -p path)" >> "$GITHUB_ENV"

      - name: Set up Helm for uninstall lifecycle tests
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Test
        run: make test

  admission:
    name: Ratify admission verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: admission/ratify-verifier/go.mod
          cache-dependency-path: admission/ratify-verifier/go.sum

      - name: Verify formatting
        working-directory: admission/ratify-verifier
        run: |
          unformatted="$(gofmt -l $(go list -f '{{.Dir}}' ./...))"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        working-directory: admission/ratify-verifier
        run: go build ./...

      # Delegates to the Makefile target so `make check-all` and CI stay identical.
      - name: Vet and test
        run: make admission-check

  provisioner-image:
    name: Node provisioner image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --build-arg TARGETARCH=amd64 -t brewlet-node-provisioner:ci -f provisioner/Dockerfile .

      - name: Verify source policy validator
        run: docker run --rm --entrypoint /usr/bin/test brewlet-node-provisioner:ci -x /opt/brewlet-dist/brewlet-source-policy

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kubernetes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: kubernetes/go.mod
          cache-dependency-path: kubernetes/go.sum

      - name: Lint and render chart
        run: make helm-check

      - name: Check site and installation contracts
        run: make -C .. site-contract-check

  supply-chain:
    name: Workflow supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce workflow pinning and permission scoping
        run: make workflow-security-check

      - name: Test release specification version guard
        run: bash scripts/check-release-version_test.sh

  container-security:
    name: Container build integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Enforce Dockerfile security policy
        run: make container-security-check

      - name: Test verified multi-architecture builds
        run: make container-security-test

  maven-plugin:
    name: Maven plugin (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    defaults:
      run:
        working-directory: maven-plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: maven-plugin/pom.xml

      - name: Build and test
        run: |
          mvn -B --no-transfer-progress -Dmaven.compiler.release=17 verify
          scripts/generate-notice.sh --check
          unzip -l target/brewlet-maven-plugin-*.jar | grep -q 'META-INF/NOTICE.txt'
          unzip -l target/brewlet-maven-plugin-*.jar | grep -q 'META-INF/LICENSE.txt'

  notices:
    name: License and notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify source license headers
        run: ./scripts/check-license-headers.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            kubernetes/go.sum

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/notices/package-lock.json

      - name: Verify Go notices
        run: |
          work="$(mktemp -d)"
          GOOS=linux GOARCH=amd64 ./scripts/generate-go-notice.sh \
            core "$work/cli.txt" ./cmd/brewlet
          GOOS=linux GOARCH=amd64 ./scripts/generate-go-notice.sh \
            core "$work/provisioner.txt" \
            ./shim/cmd/containerd-shim-brewlet-v2 \
            ./cmd/brewlet-metrics-exporter \
            ./cmd/brewlet-source-policy
          GOOS=linux GOARCH=amd64 ./scripts/generate-go-notice.sh \
            kubernetes "$work/operator.txt" ./cmd/manager
          GOOS=linux GOARCH=amd64 ./scripts/generate-go-notice.sh \
            kubernetes "$work/admission.txt" ./cmd/admission
          test -s "$work/cli.txt"
          test -s "$work/provisioner.txt"
          test -s "$work/operator.txt"
          test -s "$work/admission.txt"

      - name: Verify website notice
        run: |
          python -m pip install --quiet -r site/requirements.txt
          npm ci --ignore-scripts --prefix site/notices
          python site/scripts/generate-notice.py
          git diff --exit-code -- site/NOTICE.txt
