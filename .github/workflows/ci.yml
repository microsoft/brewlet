name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.select.outputs.core }}
      kubernetes: ${{ steps.select.outputs.kubernetes }}
      helm: ${{ steps.select.outputs.helm }}
      maven: ${{ steps.select.outputs.maven }}
      provisioner: ${{ steps.select.outputs.provisioner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: select
        name: Select component checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            .github/scripts/select-ci.sh /dev/null --all
            exit
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > changed-files.txt
          .github/scripts/select-ci.sh changed-files.txt

  core:
    name: Go core runtime
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l $(go list -f '{{.Dir}}' ./...))"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

  kubernetes:
    name: Go Kubernetes platform
    needs: changes
    if: needs.changes.outputs.kubernetes == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kubernetes
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: kubernetes/go.mod
          cache-dependency-path: kubernetes/go.sum

      - name: Verify formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Set up envtest control plane
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.19
          setup_envtest="$(go env GOPATH)/bin/setup-envtest"
          echo "KUBEBUILDER_ASSETS=$("$setup_envtest" use 1.31.0 -p path)" >> "$GITHUB_ENV"

      - name: Test
        run: make test

  helm:
    name: Helm chart
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kubernetes
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint and render chart
        run: make helm-check

  maven-plugin:
    name: Maven plugin
    needs: changes
    if: needs.changes.outputs.maven == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maven-plugin
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: maven-plugin/pom.xml

      - name: Build and test
        run: mvn -B --no-transfer-progress verify

  provisioner:
    name: Node provisioner
    needs: changes
    if: needs.changes.outputs.provisioner == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test entrypoint
        run: bash provisioner/entrypoint_test.sh

  gate:
    name: CI gate
    if: always()
    needs: [changes, core, kubernetes, helm, maven-plugin, provisioner]
    runs-on: ubuntu-latest
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      CORE_RESULT: ${{ needs.core.result }}
      KUBERNETES_RESULT: ${{ needs.kubernetes.result }}
      HELM_RESULT: ${{ needs.helm.result }}
      MAVEN_RESULT: ${{ needs['maven-plugin'].result }}
      PROVISIONER_RESULT: ${{ needs.provisioner.result }}
    steps:
      - name: Verify selected checks
        run: |
          for result in \
            "$CHANGES_RESULT" "$CORE_RESULT" "$KUBERNETES_RESULT" \
            "$HELM_RESULT" "$MAVEN_RESULT" "$PROVISIONER_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "A required CI job finished with result: $result" >&2; exit 1 ;;
            esac
          done
