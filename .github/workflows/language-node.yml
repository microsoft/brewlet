name: Node.js example E2E

# Non-gating daily real-node E2E for the Node.js example fixture against main.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      architecture:
        description: Execute on the actual native architecture, not emulation
        type: choice
        required: true
        default: amd64
        options: [amd64, arm64]

permissions:
  contents: read

concurrency:
  group: language-node-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: node (${{ inputs.architecture || 'amd64' }})
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/language-e2e
        with:
          language: node
          architecture: ${{ inputs.architecture || 'amd64' }}
