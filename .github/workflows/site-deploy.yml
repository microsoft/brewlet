name: Site Deploy

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "specs/**"
      - "LICENSE.txt"
      - ".github/workflows/site-pages.yml"
      - ".github/workflows/site-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'microsoft/brewlet' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/site-pages.yml
    with:
      expected_sha: ${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: brewlet-website-preview
          path: site/_site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site/_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
