name: Language example E2E
description: >-
  Non-gating real-node E2E for one example fixture (Java, Node.js, .NET, PHP or
  Python) or the WebAssembly examples. The calling job selects the native runner
  and checks out the repository before using this action.

# Python remains the qualification fixture in pr.yml, full-validation.yml and
# promotion; results produced here are never qualification evidence.
inputs:
  language:
    description: java, node, dotnet, php, python or wasm
    required: true
  architecture:
    description: amd64 or arm64; must match the native runner architecture
    required: false
    default: amd64

runs:
  using: composite
  steps:
    - name: Refuse unsupported execution contexts instead of skipping
      id: guard
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        REPOSITORY: ${{ github.repository }}
        REF: ${{ github.ref }}
        LANGUAGE: ${{ inputs.language }}
        ARCHITECTURE: ${{ inputs.architecture }}
      run: |
        test "$REPOSITORY" = microsoft/brewlet
        case "$LANGUAGE" in java|node|dotnet|php|python|wasm) ;; *) exit 1 ;; esac
        case "$ARCHITECTURE/$RUNNER_ARCH" in amd64/X64|arm64/ARM64) ;; *) exit 1 ;; esac
        case "$EVENT" in
          schedule) test "$REF" = refs/heads/main ;;
          workflow_dispatch) case "$REF" in refs/heads/*) ;; *) exit 1 ;; esac ;;
          *) exit 1 ;;
        esac
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: "3.12"
    - if: inputs.language == 'java'
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
      with:
        distribution: temurin
        java-version: "21"
        cache: maven
    - if: inputs.language == 'node'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: "22.22.0"
    - if: inputs.language == 'dotnet'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: integration-tests/fixtures/dotnet/global.json
    - name: Install host PHP CLI for the fixture probe
      if: inputs.language == 'php'
      shell: bash
      run: |
        if ! command -v php > /dev/null; then
          sudo apt-get update -q
          sudo apt-get install -y -q php-cli
        fi
        php -r 'exit(function_exists("posix_getuid") ? 0 : 1);'
    - name: Install the pinned Rust toolchain for the Spin guest
      if: inputs.language == 'wasm'
      shell: bash
      run: |
        toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' examples/wasm/spin-component/rust-toolchain.toml)"
        test -n "$toolchain"
        rustup toolchain install "$toolchain" --profile minimal --target wasm32-wasip2
    - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
      with:
        version: v3.19.0
    - uses: Azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e
      with:
        version: v1.35.0
    - name: Install pinned native suite tools
      shell: bash
      run: |
        go install sigs.k8s.io/kind@v0.33.0
        command -v htpasswd
    - name: Execute real-node example E2E
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        LANGUAGE: ${{ inputs.language }}
        ARCHITECTURE: ${{ inputs.architecture }}
      run: |
        work="integration-tests/live-v2/run-${LANGUAGE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCHITECTURE}"
        if test "$LANGUAGE" = wasm; then
          # Wasmtime WASIp1 command and Spin SDK HTTP component on the runc path.
          python3 integration-tests/live-v2/wasm.py --work "$work"
        else
          # Java also exercises the Maven producer on a real node.
          scenario=runtime
          if test "$LANGUAGE" = java; then scenario=maven; fi
          python3 integration-tests/live-v2/harness.py --scenario "$scenario" \
            --without-pinned-scenarios --local-language "$LANGUAGE" --work "$work"
        fi
    - name: Export only public outcomes
      if: always() && steps.guard.outcome == 'success'
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
        LANGUAGE: ${{ inputs.language }}
        ARCHITECTURE: ${{ inputs.architecture }}
      run: |
        result="integration-tests/live-v2/run-${LANGUAGE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCHITECTURE}/result.json"
        mkdir -p acceptance-export
        if test -f "$result"; then
          python3 acceptance/export_result.py "$result" "acceptance-export/language-${LANGUAGE}-${ARCHITECTURE}.json"
        fi
    - name: Retain public identities/outcomes only, never private work files
      if: always() && steps.guard.outcome == 'success'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: language-${{ inputs.language }}-${{ inputs.architecture }}-${{ github.sha }}
        path: acceptance-export/*.json
        if-no-files-found: warn
        retention-days: 14
