version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      # containerd/v2 >= 2.3 shims require the new bootstrap protocol and fail
      # on nodes running containerd < 2.3 (current AKS, GKE and EKS images).
      - dependency-name: github.com/containerd/containerd/v2
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: github.com/containerd/containerd/api
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      go-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: maven
    directories:
      - /maven-plugin
      - /integration-tests/fixtures/java/app
      - /integration-tests/fixtures/java/bom
      - /integration-tests/fixtures/java/dependency
    schedule:
      interval: weekly
    labels: [dependencies]

  - package-ecosystem: pip
    directory: /site
    schedule:
      interval: weekly
    labels: [dependencies]

  - package-ecosystem: nuget
    directories:
      - /integration-tests/fixtures/dotnet
      - /integration-tests/fixtures/dotnet/App
      - /integration-tests/fixtures/dotnet/Greeting
    schedule:
      interval: weekly
    labels: [dependencies]
