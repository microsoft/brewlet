# A plain Kubernetes Deployment. The image contains only ShowMyJVM's layers and
# launch.json; the node supplies the approved Java runtime selected below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: showmyjvm
  namespace: __NAMESPACE__
  labels:
    app: showmyjvm
    brewlet-demo-owner: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: showmyjvm
  template:
    metadata:
      labels:
        app: showmyjvm
      annotations:
        brewlet.sh/runtime-image: __RUNTIME__
    spec:
      runtimeClassName: brewlet
      nodeSelector:
        kubernetes.io/arch: __ARCH__
      containers:
        - name: app
          image: __IMAGE__
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 2
            failureThreshold: 60
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: showmyjvm
  namespace: __NAMESPACE__
  labels:
    app: showmyjvm
    brewlet-demo-owner: __NAMESPACE__
spec:
  selector:
    app: showmyjvm
  ports:
    - name: http
      port: 8080
      targetPort: http
