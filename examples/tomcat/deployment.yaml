apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomcat-war
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tomcat-war
  template:
    metadata:
      labels:
        app: tomcat-war
      annotations:
        runtime-image.brewlet.sh/app: tomcat
    spec:
      runtimeClassName: brewlet
      securityContext:
        fsGroup: 65532
      containers:
        - name: app
          image: APP_IMAGE
          securityContext:
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /runtime
              port: 8080
          volumeMounts:
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tomcat-war
spec:
  selector:
    app: tomcat-war
  ports:
    - port: 8080
      targetPort: 8080
